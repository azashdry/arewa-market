<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arewa Market - Register</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f5f7f2;
  margin:0;
  padding:20px;
}

.box{
  max-width:420px;
  margin:50px auto;
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,.1);
}

h1{
  text-align:center;
  color:#176b3a;
}

p{
  text-align:center;
  color:#666;
}

input{
  width:100%;
  padding:13px;
  margin:8px 0 15px;
  box-sizing:border-box;
  border:1px solid #ccc;
  border-radius:7px;
}

.password-box{
  position:relative;
  margin:8px 0 15px;
}

.password-box input{
  margin:0;
  padding-right:55px;
}

.toggle-password{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  width:auto;
  padding:5px;
  background:none;
  color:#176b3a;
  border:0;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

button{
  width:100%;
  padding:14px;
  background:#176b3a;
  color:white;
  border:0;
  border-radius:7px;
  font-size:16px;
  font-weight:bold;
}

.toggle-password:hover{
  background:none;
  opacity:1;
}

#message{
  margin:15px 0;
  padding:10px;
  display:none;
  border-radius:7px;
}
</style>
</head>

<body>

<div class="box">

<h1>Arewa Market</h1>
<p>Create your account</p>

<div id="message"></div>

<form id="registerForm">

<input
  type="text"
  id="name"
  placeholder="Full name"
  required
>

<input
  type="email"
  id="email"
  placeholder="Email"
  required
>

<div class="password-box">

  <input
    type="password"
    id="password"
    placeholder="Password"
    minlength="6"
    required
  >

  <button
    type="button"
    class="toggle-password"
    id="togglePassword"
  >
    👁️ View
  </button>

</div>

<button id="registerBtn" type="submit">
Create Account
</button>

</form>

<p>
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
  createUserWithEmailAndPassword,
  updateProfile
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const form =
document.getElementById("registerForm");

const btn =
document.getElementById("registerBtn");

const message =
document.getElementById("message");

const passwordInput =
document.getElementById("password");

const togglePassword =
document.getElementById("togglePassword");


/* =========================================
   VIEW / HIDE PASSWORD
========================================= */

togglePassword.addEventListener("click", function(){

  if(passwordInput.type === "password"){

    passwordInput.type = "text";

    togglePassword.textContent = "🙈 Hide";

  }else{

    passwordInput.type = "password";

    togglePassword.textContent = "👁️ View";

  }

});


/* =========================================
   MESSAGE
========================================= */

function showMessage(text){

  message.style.display = "block";

  message.style.background = "#ffeaea";

  message.style.color = "#a00000";

  message.textContent = text;

}


/* =========================================
   REGISTER
========================================= */

form.addEventListener("submit", async function(e){

  e.preventDefault();

  const name =
  document.getElementById("name").value.trim();

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;


  btn.disabled = true;

  btn.textContent = "Creating Account...";


  try{

    console.log("Starting Firebase registration...");


    const credential =
    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );


    const user =
    credential.user;


    console.log("AUTH SUCCESS:", user.uid);


    await updateProfile(user,{
      displayName:name
    });


    await setDoc(
      doc(db,"users",user.uid),
      {
        name:name,
        email:email,
        role:"buyer",
        isSeller:false,
        sellerStatus:"none",
        active:true,
        createdAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      }
    );


    console.log("FIRESTORE USER CREATED");


    alert("Account created successfully!");

    window.location.replace("index.html");


  }catch(error){

    console.error(
      "REGISTER ERROR CODE:",
      error.code
    );

    console.error(
      "REGISTER ERROR MESSAGE:",
      error.message
    );


    alert(
      "Firebase Error:\n\n" +
      error.code +
      "\n\n" +
      error.message
    );


    showMessage(
      error.code + ": " + error.message
    );


  }finally{

    btn.disabled = false;

    btn.textContent = "Create Account";

  }

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - Arewa Market</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7f2;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:430px;
}

.logo{
  text-align:center;
  margin-bottom:20px;
}

.logo h1{
  color:#087443;
  font-size:30px;
}

.logo p{
  color:#666;
  margin-top:5px;
}

.card{
  background:white;
  padding:25px;
  border-radius:14px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.card h2{
  text-align:center;
  color:#087443;
  margin-bottom:20px;
}

.form-group{
  margin-bottom:15px;
}

label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin-bottom:6px;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#087443;
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#087443;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  padding:10px;
  border-radius:7px;
  margin-bottom:15px;
  font-size:13px;
}

.error{
  display:block;
  background:#ffe8e8;
  color:#b00020;
}

.success{
  display:block;
  background:#e5f7eb;
  color:#087443;
}

.login{
  text-align:center;
  margin-top:18px;
  font-size:14px;
  color:#666;
}

.login a{
  color:#087443;
  font-weight:bold;
  text-decoration:none;
}

</style>
</head>

<body>

<div class="container">

  <div class="logo">

    <h1>Arewa Market</h1>

    <p>Kasuwar Arewa a Hannunka</p>

  </div>


  <div class="card">

    <h2>Create Account</h2>


    <div
      id="message"
      class="message">
    </div>


    <form id="registerForm">


      <div class="form-group">

        <label for="name">
          Full Name
        </label>

        <input
          type="text"
          id="name"
          placeholder="Enter your full name"
          required>

      </div>


      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required>

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Create password"
          minlength="6"
          required>

      </div>


      <div class="form-group">

        <label for="confirmPassword">
          Confirm Password
        </label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm password"
          minlength="6"
          required>

      </div>


      <button
        type="submit"
        id="registerBtn">

        Create Account

      </button>

    </form>


    <div class="login">

      Already have an account?

      <a href="login.html">
        Login
      </a>

    </div>

  </div>

</div>


<script type="module">

import {
  auth,
  db
} from "./firebase.js";


import {
  createUserWithEmailAndPassword,
  updateProfile
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const form =
  document.getElementById(
    "registerForm"
  );


const button =
  document.getElementById(
    "registerBtn"
  );


const message =
  document.getElementById(
    "message"
  );


function showMessage(
  text,
  type
){

  message.textContent =
    text;

  message.className =
    "message " + type;

}


/* ==========================================
   REGISTER
========================================== */

form.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    const name =
      document.getElementById(
        "name"
      ).value.trim();


    const email =
      document.getElementById(
        "email"
      ).value.trim();


    const password =
      document.getElementById(
        "password"
      ).value;


    const confirmPassword =
      document.getElementById(
        "confirmPassword"
      ).value;


    if(password !== confirmPassword){

      showMessage(
        "Passwords do not match.",
        "error"
      );

      return;
    }


    if(password.length < 6){

      showMessage(
        "Password must be at least 6 characters.",
        "error"
      );

      return;
    }


    button.disabled =
      true;

    button.textContent =
      "Creating account...";


    try{

      /*
        CREATE FIREBASE AUTH ACCOUNT
      */

      const credential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user =
        credential.user;


      /*
        SAVE DISPLAY NAME
      */

      await updateProfile(
        user,
        {
          displayName:name
        }
      );


      /*
        CREATE FIRESTORE USER DOCUMENT
      */

      await setDoc(
        doc(
          db,
          "users",
          user.uid
        ),
        {

          name:name,

          email:email,

          role:"buyer",

          isSeller:false,

          sellerStatus:"none",

          active:true,

          createdAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp()

        }
      );


      showMessage(
        "Account created successfully.",
        "success"
      );


      /*
        GO TO HOMEPAGE
      */

      setTimeout(
        () => {

          window.location.replace(
            "index.html"
          );

        },
        700
      );


    }catch(error){

      console.error(
        "REGISTER ERROR:",
        error
      );


      let text =
        "Unable to create account.";


      if(
        error.code ===
        "auth/email-already-in-use"
      ){

        text =
          "This email is already registered.";

      }else if(
        error.code ===
        "auth/invalid-email"
      ){

        text =
          "Invalid email address.";

      }else if(
        error.code ===
        "auth/weak-password"
      ){

        text =
          "Password is too weak.";

      }


      showMessage(
        text,
        "error"
      );


      button.disabled =
        false;

      button.textContent =
        "Create Account";

    }

  }
);

</script>

</body>
</html>

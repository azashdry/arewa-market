<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arewa Market - Register</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f5f7f2;
  margin:0;
  padding:20px;
}

.box{
  max-width:420px;
  margin:50px auto;
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,.1);
}

h1{
  text-align:center;
  color:#176b3a;
}

p{
  text-align:center;
  color:#666;
}

input{
  width:100%;
  padding:13px;
  margin:8px 0 15px;
  box-sizing:border-box;
  border:1px solid #ccc;
  border-radius:7px;
}

.password-box{
  position:relative;
  margin:8px 0 15px;
}

.password-box input{
  margin:0;
  padding-right:55px;
}

.toggle-password{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  width:auto;
  padding:5px;
  background:none;
  color:#176b3a;
  border:0;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

button{
  width:100%;
  padding:14px;
  background:#176b3a;
  color:white;
  border:0;
  border-radius:7px;
  font-size:16px;
  font-weight:bold;
}

.toggle-password:hover{
  background:none;
  opacity:1;
}

#message{
  margin:15px 0;
  padding:10px;
  display:none;
  border-radius:7px;
}
</style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#075e36">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arewa Market">
</head>

<body>

<div class="box">

<h1>Arewa Market</h1>

<p>Create your account</p>

<div id="message"></div>

<form id="registerForm">

<input
  type="text"
  id="name"
  placeholder="Full name"
  required
>

<input
  type="email"
  id="email"
  placeholder="Email"
  required
>

<div class="password-box">

  <input
    type="password"
    id="password"
    placeholder="Password"
    minlength="6"
    required
  >

  <button
    type="button"
    class="toggle-password"
    id="togglePassword"
  >
    👁️ View
  </button>

</div>

<button id="registerBtn" type="submit">
Create Account
</button>

</form>

<p>
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
  createUserWithEmailAndPassword,
  updateProfile
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  doc,
  setDoc,
  serverTimestamp,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const form =
document.getElementById("registerForm");

const btn =
document.getElementById("registerBtn");

const message =
document.getElementById("message");

const passwordInput =
document.getElementById("password");

const togglePassword =
document.getElementById("togglePassword");


/* =========================================
   VIEW / HIDE PASSWORD
========================================= */

togglePassword.addEventListener("click", function(){

  if(passwordInput.type === "password"){

    passwordInput.type = "text";

    togglePassword.textContent = "🙈 Hide";

  }else{

    passwordInput.type = "password";

    togglePassword.textContent = "👁️ View";

  }

});


/* =========================================
   MESSAGE
========================================= */

function showMessage(text){

  message.style.display = "block";

  message.style.background = "#ffeaea";

  message.style.color = "#a00000";

  message.textContent = text;

}


/* =========================================
   GET REFERRAL CODE
========================================= */

const urlParams =
new URLSearchParams(
  window.location.search
);

let referralCode =
urlParams.get("ref");


/*
  Referral can come from:

  1. register.html?ref=CODE
  2. Previously saved referral code
*/

if(referralCode){

  referralCode =
  referralCode
    .trim()
    .toUpperCase();

  localStorage.setItem(
    "arewaReferralCode",
    referralCode
  );

}else{

  referralCode =
  localStorage.getItem(
    "arewaReferralCode"
  );

}


if(referralCode){

  referralCode =
  String(referralCode)
    .trim()
    .toUpperCase();

}


/* =========================================
   GENERATE REFERRAL CODE
========================================= */

function createReferralCode(name){

  const cleanName =
  String(name || "USER")
    .toUpperCase()
    .replace(
      /[^A-Z0-9]/g,
      ""
    )
    .substring(0,8);


  const randomPart =
  Math.random()
    .toString(36)
    .substring(2,7)
    .toUpperCase();


  return `AREWA-${cleanName}-${randomPart}`;

}


/* =========================================
   CREATE UNIQUE REFERRAL CODE
========================================= */

async function generateUniqueReferralCode(name){

  let attempts = 0;

  while(attempts < 5){

    const code =
    createReferralCode(name);


    const codeQuery =
    query(
      collection(db,"users"),
      where(
        "referralCode",
        "==",
        code
      )
    );


    const snapshot =
    await getDocs(codeQuery);


    if(snapshot.empty){

      return code;

    }


    attempts++;

  }


  throw new Error(
    "Unable to generate a unique referral code. Please try again."
  );

}


/* =========================================
   FIND REFERRER
========================================= */

async function findReferrer(code){

  if(!code){

    return null;

  }


  try{

    const referrerQuery =
    query(
      collection(db,"users"),
      where(
        "referralCode",
        "==",
        code
      )
    );


    const snapshot =
    await getDocs(
      referrerQuery
    );


    if(snapshot.empty){

      return null;

    }


    const referrerDoc =
    snapshot.docs[0];


    return {
      uid:referrerDoc.id,
      ...referrerDoc.data()
    };

  }catch(error){

    console.error(
      "REFERRER LOOKUP ERROR:",
      error
    );

    return null;

  }

}


/* =========================================
   REGISTER
========================================= */

form.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();


    const name =
    document
      .getElementById("name")
      .value
      .trim();


    const email =
    document
      .getElementById("email")
      .value
      .trim();


    const password =
    document
      .getElementById("password")
      .value;


    btn.disabled = true;

    btn.textContent =
      "Creating Account...";


    try{

      console.log(
        "Starting Firebase registration..."
      );


      /* =================================
         CREATE OWN REFERRAL CODE
      ================================= */

      const ownReferralCode =
      await generateUniqueReferralCode(
        name
      );


      /* =================================
         FIND REFERRER
      ================================= */

      let referredBy = "";

      let referredByUserId = "";


      if(
        referralCode &&
        referralCode.length > 0
      ){

        const referrer =
        await findReferrer(
          referralCode
        );


        if(
          referrer &&
          referrer.uid
        ){

          referredBy =
            referralCode;

          referredByUserId =
            referrer.uid;

        }

      }


      /* =================================
         CREATE FIREBASE AUTH ACCOUNT
      ================================= */

      const credential =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );


      const user =
      credential.user;


      console.log(
        "AUTH SUCCESS:",
        user.uid
      );


      /* =================================
         UPDATE AUTH PROFILE
      ================================= */

      await updateProfile(
        user,
        {
          displayName:name
        }
      );


      /* =================================
         SELF REFERRAL PROTECTION
      ================================= */

      if(
        referredByUserId === user.uid
      ){

        referredBy = "";

        referredByUserId = "";

      }


      /* =================================
         REFERRAL STATUS
      ================================= */

      const hasReferrer =
        Boolean(
          referredByUserId
        );


      const referralStatus =
        hasReferrer
          ? "registered"
          : "";


      /* =================================
         CREATE USER DOCUMENT
      ================================= */

      await setDoc(
        doc(
          db,
          "users",
          user.uid
        ),
        {

          name:name,

          email:email,

          role:"buyer",

          isSeller:false,

          sellerStatus:"none",

          active:true,


          /* ============================
             OWN REFERRAL INFORMATION
          ============================ */

          referralCode:
            ownReferralCode,


          /* ============================
             REFERRER INFORMATION
          ============================ */

          referredBy:
            referredBy,


          referredByUserId:
            referredByUserId,


          referralStatus:
            referralStatus,


          referralJoinedAt:
            hasReferrer
              ? serverTimestamp()
              : null,


          /* ============================
             NORMAL USER DATES
          ============================ */

          createdAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp()

        }
      );


      console.log(
        "FIRESTORE USER CREATED"
      );


      /* =================================
         REMOVE USED REFERRAL CODE
      ================================= */

      localStorage.removeItem(
        "arewaReferralCode"
      );


      alert(
        "Account created successfully!"
      );


      window.location.replace(
        "index.html"
      );


    }catch(error){

      console.error(
        "REGISTER ERROR CODE:",
        error.code
      );


      console.error(
        "REGISTER ERROR MESSAGE:",
        error.message
      );


      alert(
        "Firebase Error:\n\n" +
        error.code +
        "\n\n" +
        error.message
      );


      showMessage(
        error.code +
        ": " +
        error.message
      );


    }finally{

      btn.disabled = false;

      btn.textContent =
        "Create Account";

    }

});

</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>

</html>

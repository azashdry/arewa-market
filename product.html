<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product Details - Arewa Market</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">


  <style>
:root{color-scheme:dark}input,select,textarea{background-color:#0b1020;color:#e8ecf8}input::placeholder,textarea::placeholder{color:#7f8bad}

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:'Inter',Arial,sans-serif;
    }

    
h1,h2,h3,.brand h1,.brand-name,.logo,.hero h2,.page-title,.auth-title,.box h2,.modal h2,.modal-title{
  font-family:'Inter',system-ui,sans-serif;
  letter-spacing:.2px;
}
body{
      background:#0b1020;
      color:#e8ecf8;
    }

    /* ================= HEADER ================= */

    header{
      background:linear-gradient(135deg,#0d1a3f,#2f6bff);
      color:white;
      padding:15px 20px;
      position:sticky;
      top:0;
      z-index:1000;
      box-shadow:0 2px 8px rgba(0,0,0,.15);
      border-bottom:3px solid #2f6bff;
    }

    .header-inner{
      max-width:1200px;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
    }

    .brand{
      text-decoration:none;
      color:white;
    }

    .brand h1{
      font-size:23px;
    }

    .brand p{
      font-size:12px;
      opacity:.9;
      margin-top:3px;
    }

    nav{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    nav a,
    nav button{
      border:none;
      text-decoration:none;
      background: #121a30;
      color:#e8ecf8;
      padding:9px 13px;
      border-radius:8px;
      font-size:13px;
      font-weight:bold;
      cursor:pointer;
    }

    nav a.seller-btn{
      background:#2f6bff;
      color:#e8ecf8;
    }

    nav button.logout{
      background:#b42318;
      color:white;
    }

    /* ================= MAIN ================= */

    main{
      max-width:1100px;
      margin:auto;
      padding:30px 15px 60px;
    }

    .back-btn{
      display:inline-block;
      margin-bottom:20px;
      padding:10px 15px;
      background: #121a30;
      color:#e8ecf8;
      border:1px solid #1f3a7a;
      border-radius:7px;
      text-decoration:none;
      font-weight:bold;
      font-size:14px;
    }

    .back-btn:hover{
      background:#1a3fa0;
      color:white;
    }

    /* ================= PRODUCT ================= */

    .product-details{
      background: #121a30;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 3px 15px rgba(0,0,0,.08);
      display:grid;
      grid-template-columns:1fr 1fr;
    }

    .product-image-area{
      background:#0b1020;
      min-height:430px;
    }

    .product-image{
      width:100%;
      height:100%;
      min-height:430px;
      object-fit:cover;
      display:block;
    }

    .product-info{
      padding:30px;
    }

    .featured{
      display:inline-block;
      background:#2f6bff;
      color:white;
      padding:5px 9px;
      border-radius:5px;
      font-size:12px;
      margin-bottom:12px;
      font-weight:bold;
    }

    /* ================= PREMIUM BADGE ================= */

    .premium-badge{
      display:inline-flex;
      align-items:center;
      gap:5px;
      background:#2f6bff;
      color:white;
      padding:6px 10px;
      border-radius:6px;
      font-size:12px;
      font-weight:bold;
      margin-bottom:12px;
      box-shadow:0 2px 5px rgba(0,0,0,.12);
    }

    .product-info h2{
      font-size:30px;
      color:#e8ecf8;
      margin-bottom:12px;
    }

    .price{
      color:#f5c451;
      font-size:27px;
      font-weight:bold;
      margin-bottom:20px;
    }

    .meta{
      border-top:1px solid #243056;
      border-bottom:1px solid #243056;
      padding:15px 0;
      margin-bottom:20px;
    }

    .meta div{
      margin-bottom:9px;
      color:#9aa6c4;
      font-size:14px;
    }

    .meta div:last-child{
      margin-bottom:0;
    }

    .description-title{
      color:#e8ecf8;
      margin-bottom:8px;
      font-size:18px;
    }

    .description{
      color:#9aa6c4;
      line-height:1.7;
      font-size:14px;
      white-space:pre-wrap;
    }

    /* ================= SELLER ================= */

    .seller-box{
      margin-top:25px;
      padding:18px;
      background:#0b1020;
      border-radius:9px;
    }

    .seller-box h3{
      color:#e8ecf8;
      margin-bottom:8px;
    }

    .seller-name{
      font-weight:bold;
      margin-bottom:8px;
    }

    .seller-link{
      display:inline-block;
      background:#1a3fa0;
      color:white;
      text-decoration:none;
      padding:10px 15px;
      border-radius:6px;
      font-size:13px;
      font-weight:bold;
      margin-top:5px;
    }

    .seller-link:hover{
      background:#0d1a3f;
    }

    /* ================= VERIFIED BADGE ================= */

    .verified-badge{
      display:inline-flex;
      align-items:center;
      gap:4px;
      background:#0b1020;
      color:#e8ecf8;
      font-size:12px;
      font-weight:bold;
      padding:3px 9px;
      border-radius:10px;
      margin-left:6px;
    }

    /* ================= RATING ================= */

    .rating-line{
      display:flex;
      align-items:center;
      gap:6px;
      margin-bottom:14px;
      font-size:14px;
      color:#9aa6c4;
    }

    .rating-line .stars{
      color:#6b9bff;
      letter-spacing:1px;
      font-size:16px;
    }

    /* ================= DELIVERY INFO ================= */

    .delivery-box{
      background:#0b1020;
      border-radius:8px;
      padding:10px 14px;
      font-size:13.5px;
      color:#e8ecf8;
      margin-bottom:18px;
    }

    /* ================= INTERESTED BUTTON ================= */

    .interested-btn{
      display:inline-block;
      background:#2f6bff;
      color:#e8ecf8;
      border:none;
      padding:11px 16px;
      border-radius:7px;
      font-weight:bold;
      font-size:14px;
      cursor:pointer;
      margin-top:10px;
      width:100%;
      text-align:center;
      text-decoration:none;
    }

    .interested-btn:hover{
      background:#2f6bff;
    }

    /* ================= REVIEWS ================= */

    .reviews-section{
      margin-top:25px;
      padding-top:20px;
      border-top:1px solid #243056;
    }

    .reviews-section h3{
      color:#e8ecf8;
      margin-bottom:12px;
      font-size:18px;
    }

    .review-form .star-input{
      font-size:24px;
      color:#6b9bff;
      cursor:pointer;
      margin-bottom:8px;
    }

    .review-form textarea{
      width:100%;
      border:1px solid #243056;
      border-radius:7px;
      padding:9px;
      font-size:13.5px;
      font-family:inherit;
      margin-bottom:8px;
      resize:vertical;
      min-height:60px;
    }

    .review-form button{
      background:#1a3fa0;
      color:white;
      border:none;
      padding:9px 15px;
      border-radius:6px;
      font-weight:bold;
      cursor:pointer;
      font-size:13.5px;
    }

    .review-form .review-error{
      color:#ff8a8a;
      font-size:12.5px;
      margin-top:6px;
      display:none;
    }

    .review-item{
      border-bottom:1px solid #243056;
      padding:12px 0;
    }

    .review-item .review-head{
      display:flex;
      justify-content:space-between;
      font-size:13px;
      font-weight:bold;
      color:#e8ecf8;
      margin-bottom:4px;
    }

    .review-item .review-stars{
      color:#6b9bff;
      font-size:13px;
    }

    .review-item .review-comment{
      font-size:13.5px;
      color:#9aa6c4;
      line-height:1.5;
    }

    .no-reviews{
      font-size:13.5px;
      color:#9aa6c4;
    }

    /* ================= LOADING ================= */

    .loading,
    .error-box{
      background: #121a30;
      padding:50px 20px;
      text-align:center;
      border-radius:10px;
      box-shadow:0 2px 10px rgba(0,0,0,.06);
    }

    .loading{
      color:#e8ecf8;
    }

    .error-box h2{
      color:#e8ecf8;
      margin-bottom:10px;
    }

    .error-box p{
      color:#9aa6c4;
      margin-bottom:20px;
    }

    .home-btn{
      display:inline-block;
      background:#1a3fa0;
      color:white;
      text-decoration:none;
      padding:10px 16px;
      border-radius:6px;
      font-weight:bold;
    }

    /* ================= MESSAGE ================= */

    #message{
      display:none;
      position:fixed;
      top:80px;
      right:15px;
      z-index:2000;
      max-width:320px;
      padding:13px 16px;
      border-radius:7px;
      color:white;
      background:#1a3fa0;
      box-shadow:0 3px 12px rgba(0,0,0,.2);
    }

    /* ================= FOOTER ================= */

    footer{
      background:#0d1a3f;
      color:white;
      padding:25px 15px;
      text-align:center;
    }

    footer p{
      font-size:13px;
      opacity:.9;
    }

    /* ================= MOBILE ================= */

    @media(max-width:700px){

      .header-inner{
        align-items:flex-start;
        flex-direction:column;
      }

      nav{
        width:100%;
      }

      nav a,
      nav button{
        flex:1;
        text-align:center;
      }

      .product-details{
        grid-template-columns:1fr;
      }

      .product-image-area{
        min-height:280px;
      }

      .product-image{
        min-height:280px;
        max-height:350px;
      }

      .product-info{
        padding:20px;
      }

      .product-info h2{
        font-size:24px;
      }

      .price{
        font-size:23px;
      }
    }
  
/* ================= BOTTOM NAV (mobile) ================= */

  <!-- ================= JAVASCRIPT ================= -->

  <script type="module">

    import {
      auth,
      db
    } from "./firebase.js";


    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
      doc,
      getDoc,
      collection,
      addDoc,
      getDocs,
      query,
      where,
      orderBy,
      limit,
      runTransaction,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    import {
      isPremiumActive,
      getVisibleProductIds
    } from "./premium-utils.js";


    // =================================================
    // ELEMENTS
    // =================================================

    const content =
      document.getElementById("content");

    const navArea =
      document.getElementById("navArea");

    const messageBox =
      document.getElementById("message");


    // =================================================
    // MESSAGE
    // =================================================

    function showMessage(text){

      messageBox.textContent = text;

      messageBox.style.display = "block";

      setTimeout(() => {

        messageBox.style.display = "none";

      },3000);

    }


    // =================================================
    // AUTH
    // =================================================

    onAuthStateChanged(auth, async (user) => {

      if(!user){

        renderLoggedOutNav();

        return;

      }

      let userData = null;

      try{

        const userSnap =
          await getDoc(
            doc(db,"users",user.uid)
          );

        if(userSnap.exists()){

          userData =
            userSnap.data();

        }

      }catch(error){

        console.error(
          "User profile error:",
          error
        );

      }

      renderLoggedInNav(userData);

    });


    // =================================================
    // LOGGED OUT NAV
    // =================================================

    function renderLoggedOutNav(){

      navArea.innerHTML = `

        <a href="login.html">
          Login
        </a>

        <a href="register.html">
          Register
        </a>

      `;

    }


    // =================================================
    // LOGGED IN NAV
    // =================================================

    function renderLoggedInNav(userData){

      let html = "";

      const isApprovedSeller =
        userData &&
        userData.role === "seller" &&
        userData.isSeller === true &&
        userData.sellerStatus === "approved";


      if(isApprovedSeller){

        html += `

          <a
            href="seller-dashboard.html"
            class="seller-btn"
          >
            Seller Dashboard
          </a>

        `;

      }else{

        const isBuyer =
          !userData ||
          userData.role === "buyer";

        if(isBuyer){

          html += `

            <a
              href="seller-apply.html"
              class="seller-btn"
            >
              Become a Seller
            </a>

          `;

        }

      }


      html += `

        <button
          class="logout"
          id="logoutBtn"
        >
          Logout
        </button>

      `;


      navArea.innerHTML = html;


      const logoutBtn =
        document.getElementById("logoutBtn");


      if(logoutBtn){

        logoutBtn.addEventListener(
          "click",
          async () => {

            try{

              await signOut(auth);

              showMessage(
                "You have been logged out."
              );

              setTimeout(() => {

                window.location.reload();

              },700);

            }catch(error){

              console.error(error);

              showMessage(
                "Logout failed."
              );

            }

          }
        );

      }

    }


    // =================================================
    // GET PRODUCT ID
    // =================================================

    const params =
      new URLSearchParams(
        window.location.search
      );


    const productId =
      params.get("id");


    // =================================================
    // LOAD PRODUCT
    // =================================================

    async function loadProduct(){

      if(!productId){

        showError(
          "Product not found.",
          "No product ID was provided."
        );

        return;

      }


      try{

        const productRef =
          doc(
            db,
            "products",
            productId
          );


        const productSnap =
          await getDoc(productRef);


        if(
          !productSnap.exists()
        ){

          showError(
            "Product not found.",
            "This product may have been removed."
          );

          return;

        }


        const product =
          productSnap.data();


        if(
          product.status !== "active"
        ){

          showError(
            "Product unavailable.",
            "This product is currently not available."
          );

          return;

        }


        /*
          FREE PLAN LIMIT CHECK
          ================================================
          If this product's seller is not currently Premium,
          only their oldest FREE_MAX_PRODUCTS products remain
          visible. If this product fell outside that limit
          (e.g. Premium expired after it was added), treat it
          as unavailable here too - it isn't deleted, it will
          reappear automatically once the seller is Premium
          again or removes older products.
        */

        if(
          product.sellerId &&
          product.sellerId !== "admin"
        ){

          try{

            const sellerSnap =
              await getDoc(
                doc(db, "users", product.sellerId)
              );

            const seller =
              sellerSnap.exists() ? sellerSnap.data() : null;

            const sellerIsPremium =
              isPremiumActive(seller);

            if(!sellerIsPremium){

              const siblingSnap =
                await getDocs(
                  query(
                    collection(db, "products"),
                    where("sellerId", "==", product.sellerId),
                    where("status", "==", "active")
                  )
                );

              const siblingProducts = [];

              siblingSnap.forEach(item => {
                siblingProducts.push({
                  id: item.id,
                  ...item.data()
                });
              });

              const visibleIds =
                getVisibleProductIds(
                  siblingProducts,
                  false
                );

              if(!visibleIds.has(productId)){

                showError(
                  "Product unavailable.",
                  "This product is currently not available."
                );

                return;

              }

            }

          }catch(error){

            console.error(
              "Free plan limit check error:",
              error
            );
            // If the check itself fails, fail open (still show
            // the product) rather than hiding it by mistake.

          }

        }


        renderProduct(product);

      }catch(error){

        console.error(
          "Product loading error:",
          error
        );


        showError(
          "Unable to load product.",
          "Please check your connection and try again."
        );

      }

    }


    // =================================================
    // RENDER PRODUCT
    // =================================================

    async function renderProduct(product){

      const image =
        product.imageUrl ||
        "https://via.placeholder.com/700x500?text=Arewa+Market";


      const name =
        product.name ||
        "Unnamed Product";


      const price =
        Number(
          product.price || 0
        ).toLocaleString(
          "en-NG"
        );


      const category =
        product.category ||
        "Uncategorized";


      const location =
        product.location ||
        "Northern Nigeria";


      const sellerName =
        product.sellerName ||
        "Arewa Market";


      const description =
        product.description ||
        "No description available.";


      const featured =
        product.featured === true
          ? `
            <span class="featured">
              Featured
            </span>
          `
          : "";


      /*
        ================================================
        PREMIUM SELLER CHECK
        ================================================

        Product data may not contain the seller's
        current subscription information.

        Therefore we read users/{sellerId} and check:

        subscriptionPlan === "premium"
        subscriptionStatus === "active"

        The badge only appears while Premium is active.
      */

      let premiumBadge = "";
      let verifiedBadge = "";


      if(
        product.sellerId &&
        product.sellerId !== "admin"
      ){

        try{

          const sellerSnap =
            await getDoc(
              doc(
                db,
                "users",
                product.sellerId
              )
            );


          if(sellerSnap.exists()){

            const seller =
              sellerSnap.data();


            const isPremium =
              isPremiumActive(seller);


            if(isPremium){

              premiumBadge = `

                <div class="premium-badge">
                  ★ PREMIUM SELLER
                </div>

              `;

            }


            if(seller.verified === true){

              verifiedBadge = `
                <span class="verified-badge">
                  ✔ Verified Seller
                </span>
              `;

            }

          }

        }catch(error){

          console.error(
            "Premium seller check error:",
            error
          );

        }

      }


      let sellerBox = "";


      if(
        product.sellerId &&
        product.sellerId !== "admin"
      ){

        const interestedUrl =
          "messages.html?sellerId=" +
          encodeURIComponent(product.sellerId) +
          "&productId=" +
          encodeURIComponent(productId) +
          "&productName=" +
          encodeURIComponent(name) +
          "&productPrice=" +
          encodeURIComponent(price);

        sellerBox = `

          <div class="seller-box">

            <h3>
              Seller
            </h3>

            ${premiumBadge}

            <div class="seller-name">
              ${escapeHtml(sellerName)}
              ${verifiedBadge}
            </div>

            <a
              class="seller-link"
              href="seller-profile.html?id=${encodeURIComponent(
                product.sellerId
              )}"
            >
              View Seller Profile →
            </a>

            <a
              class="interested-btn"
              href="${interestedUrl}"
            >
              🙋 Ina Sha'awa (I'm Interested)
            </a>

          </div>

        `;

      }else{

        sellerBox = `

          <div class="seller-box">

            <h3>
              Seller
            </h3>

            <div class="seller-name">
              Arewa Market
            </div>

          </div>

        `;

      }


      content.innerHTML = `

        <article class="product-details">

          <div class="product-image-area">

            <img
              class="product-image"
              src="${escapeHtml(image)}"
              alt="${escapeHtml(name)}"
              onerror="
                this.src='https://via.placeholder.com/700x500?text=Arewa+Market'
              "
            >

          </div>


          <div class="product-info">

            ${featured}


            <h2>
              ${escapeHtml(name)}
            </h2>


            <div class="price">
              ₦${price}
            </div>

            <div class="rating-line" id="ratingLine">
              <span class="stars">${renderStarString(product.avgRating || 0)}</span>
              <span>
                ${(product.avgRating || 0).toFixed ? Number(product.avgRating || 0).toFixed(1) : "0.0"}
                (${product.reviewCount || 0} reviews)
              </span>
            </div>


            <div class="meta">

              <div>
                📂 <strong>Category:</strong>
                ${escapeHtml(category)}
              </div>

              <div>
                📍 <strong>Location:</strong>
                ${escapeHtml(location)}
              </div>

              <div>
                👤 <strong>Seller:</strong>
                ${escapeHtml(sellerName)}
              </div>

            </div>

            <div class="delivery-box">
              🚚 <strong>Delivery:</strong>
              ${deliveryLabel(product.deliveryOption)}
              ${
                product.deliveryOption === "seller_delivers" &&
                Number(product.deliveryFee) > 0
                  ? " — ₦" + Number(product.deliveryFee).toLocaleString("en-NG")
                  : ""
              }
            </div>


            <h3 class="description-title">
              Product Description
            </h3>


            <div class="description">
              ${escapeHtml(description)}
            </div>


            ${sellerBox}


            <div class="reviews-section" id="reviewsSection">

              <h3>Reviews & Ratings</h3>

              <div class="review-form" id="reviewForm">

                <p style="font-size:13px;margin-bottom:6px;color:#9aa6c4;">
                  Bar Review akan wannan kaya:
                </p>

                <div class="star-input" id="starInput">
                  <span data-val="1">☆</span><span data-val="2">☆</span><span data-val="3">☆</span><span data-val="4">☆</span><span data-val="5">☆</span>
                </div>

                <textarea id="reviewComment" placeholder="Yaya kwarewarka da wannan seller/kaya?"></textarea>

                <button id="submitReviewBtn" type="button">Aika Review</button>

                <div class="review-error" id="reviewError"></div>

              </div>

              <div id="reviewsList" style="margin-top:16px;">
                <p class="no-reviews">Loading reviews...</p>
              </div>

            </div>

          </div>

        </article>

      `;


      document.title =
        `${name} - Arewa Market`;


      attachReviewFormHandlers(product);

      loadReviews();

    }


    // =================================================
    // DELIVERY LABEL
    // =================================================

    function deliveryLabel(option){

      const labels = {
        seller_delivers: "Seller Zai Kai Maka (Delivery)",
        buyer_pickup: "Ka Zo Ka Ɗauka (Pickup)",
        meetup: "Mu Hadu a Wuri (Meet-up)"
      };

      return labels[option] || "Ba a bayyana ba";

    }


    // =================================================
    // STAR STRING HELPER
    // =================================================

    function renderStarString(rating){

      const full =
        Math.round(Number(rating) || 0);

      return "★".repeat(full) + "☆".repeat(5 - full);

    }


    // =================================================
    // REVIEWS: SUBMIT
    // =================================================

    let selectedReviewRating = 0;

    function attachReviewFormHandlers(product){

      selectedReviewRating = 0;

      const starInput =
        document.getElementById("starInput");

      const submitBtn =
        document.getElementById("submitReviewBtn");

      const errorEl =
        document.getElementById("reviewError");

      if(!starInput || !submitBtn) return;

      starInput.querySelectorAll("span").forEach(s => {

        s.addEventListener("click", () => {

          selectedReviewRating =
            Number(s.dataset.val);

          starInput.querySelectorAll("span").forEach(x => {

            x.textContent =
              Number(x.dataset.val) <= selectedReviewRating
                ? "★"
                : "☆";

          });

        });

      });

      submitBtn.addEventListener("click", async () => {

        errorEl.style.display = "none";

        if(!auth.currentUser){

          errorEl.textContent =
            "Dole ne ka Login kafin ka aika review.";

          errorEl.style.display = "block";

          return;

        }

        if(selectedReviewRating === 0){

          errorEl.textContent =
            "Zaɓi taurari (rating) kafin ka aika.";

          errorEl.style.display = "block";

          return;

        }

        const comment =
          document.getElementById("reviewComment").value.trim();

        submitBtn.disabled = true;
        submitBtn.textContent = "Ana Aikawa...";

        try{

          const buyerSnap =
            await getDoc(
              doc(db, "users", auth.currentUser.uid)
            );

          const buyerName =
            buyerSnap.exists()
              ? (buyerSnap.data().name || "Buyer")
              : "Buyer";

          const productRef =
            doc(db, "products", productId);

          await runTransaction(db, async (tx) => {

            const productSnap =
              await tx.get(productRef);

            if(!productSnap.exists()){
              throw new Error("Product din ba ya nan.");
            }

            const data =
              productSnap.data();

            const oldCount =
              data.reviewCount || 0;

            const oldAvg =
              data.avgRating || 0;

            const newCount =
              oldCount + 1;

            const newAvg =
              ((oldAvg * oldCount) + selectedReviewRating) / newCount;

            const reviewRef =
              doc(collection(db, "reviews"));

            tx.set(reviewRef, {
              productId,
              sellerId: product.sellerId || null,
              buyerId: auth.currentUser.uid,
              buyerName,
              rating: selectedReviewRating,
              comment: comment || "",
              createdAt: serverTimestamp()
            });

            tx.update(productRef, {
              avgRating: Math.round(newAvg * 10) / 10,
              reviewCount: newCount
            });

          });

          document.getElementById("reviewComment").value = "";

          selectedReviewRating = 0;

          starInput.querySelectorAll("span").forEach(x => {
            x.textContent = "☆";
          });

          showMessage("Na gode! Review ɗinka an aika.");

          await loadReviews();

        }catch(error){

          console.error("Submit review error:", error);

          errorEl.textContent =
            error.message || "An kasa aika review. Sake gwadawa.";

          errorEl.style.display = "block";

        }

        submitBtn.disabled = false;
        submitBtn.textContent = "Aika Review";

      });

    }


    // =================================================
    // REVIEWS: LOAD & RENDER
    // =================================================

    async function loadReviews(){

      const listEl =
        document.getElementById("reviewsList");

      if(!listEl) return;

      try{

        const q =
          query(
            collection(db, "reviews"),
            where("productId", "==", productId),
            orderBy("createdAt", "desc"),
            limit(20)
          );

        const snap =
          await getDocs(q);

        if(snap.empty){

          listEl.innerHTML =
            `<p class="no-reviews">Babu review tukuna akan wannan kaya.</p>`;

          return;

        }

        listEl.innerHTML =
          snap.docs.map(d => {

            const r = d.data();

            const stars =
              renderStarString(r.rating || 0);

            return `
              <div class="review-item">
                <div class="review-head">
                  <span>${escapeHtml(r.buyerName || "Buyer")}</span>
                  <span class="review-stars">${stars}</span>
                </div>
                ${
                  r.comment
                    ? `<div class="review-comment">${escapeHtml(r.comment)}</div>`
                    : ""
                }
              </div>
            `;

          }).join("");

      }catch(error){

        console.error("Load reviews error:", error);

        listEl.innerHTML =
          `<p class="no-reviews">An kasa loading reviews.</p>`;

      }

    }


    // =================================================
    // ERROR
    // =================================================

    function showError(title,text){

      content.innerHTML = `

        <div class="error-box">

          <h2>
            ${escapeHtml(title)}
          </h2>

          <p>
            ${escapeHtml(text)}
          </p>

          <a
            href="index.html"
            class="home-btn"
          >
            Back to Marketplace
          </a>

        </div>

      `;

    }


    // =================================================
    // ESCAPE HTML
    // =================================================

    function escapeHtml(value){

      return String(value ?? "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    // =================================================
    // START
    // =================================================

    loadProduct();

  </script>

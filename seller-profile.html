<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Arewa Market - Seller Profile</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7f5;
  color:#222;
}

/* =========================
   HEADER
========================= */

header{
  background:#087f5b;
  color:white;
  padding:15px 20px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:15px;
  flex-wrap:wrap;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo small{
  display:block;
  font-size:12px;
  font-weight:normal;
  margin-top:3px;
}

.header-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  padding:10px 15px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
  text-decoration:none;
  display:inline-block;
}

.btn-light{
  background:white;
  color:#087f5b;
}

.btn-gold{
  background:#d4a017;
  color:white;
}

.btn-danger{
  background:#dc3545;
  color:white;
}

.btn-green{
  background:#087f5b;
  color:white;
}

.btn:hover{
  opacity:.9;
}

/* =========================
   CONTAINER
========================= */

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

/* =========================
   MESSAGE
========================= */

.message{
  display:none;
  padding:12px;
  margin-bottom:15px;
  border-radius:7px;
}

.message.error{
  display:block;
  background:#f8d7da;
  color:#721c24;
}

/* =========================
   SELLER PROFILE
========================= */

.profile-panel{
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  margin-bottom:25px;
}

.profile-top{
  display:flex;
  align-items:center;
  gap:25px;
  flex-wrap:wrap;
}

.profile-image{
  width:150px;
  height:150px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
  border:4px solid #087f5b;
}

.profile-info{
  flex:1;
  min-width:240px;
}

.profile-info h1{
  color:#087f5b;
  margin-bottom:6px;
  font-size:30px;
}

.business-name{
  font-size:18px;
  color:#555;
  margin-bottom:12px;
}

.profile-detail{
  margin:7px 0;
  color:#555;
}

.profile-detail strong{
  color:#222;
}

.status{
  display:inline-block;
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.status-approved{
  background:#d4edda;
  color:#155724;
}

.description{
  margin-top:15px;
  line-height:1.6;
  color:#555;
}

/* =========================
   CONTACT
========================= */

.contact-actions{
  margin-top:18px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.contact-actions a{
  text-decoration:none;
}

/* =========================
   PRODUCTS
========================= */

.products-panel{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.products-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.products-header h2{
  color:#087f5b;
}

.products-count{
  color:#666;
  font-size:14px;
}

.products-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.product-card{
  border:1px solid #ddd;
  border-radius:10px;
  overflow:hidden;
  background:white;
}

.product-image{
  width:100%;
  height:190px;
  object-fit:cover;
  background:#eee;
}

.product-body{
  padding:15px;
}

.product-body h3{
  color:#087f5b;
  margin-bottom:8px;
}

.price{
  color:#d4a017;
  font-size:18px;
  font-weight:bold;
  margin-bottom:8px;
}

.product-meta{
  color:#666;
  font-size:14px;
  margin:5px 0;
}

.product-description{
  color:#555;
  font-size:14px;
  line-height:1.5;
  margin-top:10px;
}

.view-product{
  display:block;
  margin-top:14px;
  background:#087f5b;
  color:white;
  text-align:center;
  padding:10px;
  border-radius:7px;
  text-decoration:none;
  font-weight:bold;
  font-size:14px;
}

.view-product:hover{
  opacity:.9;
}

/* =========================
   LOADING
========================= */

.loading{
  text-align:center;
  padding:35px;
  color:#087f5b;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:35px;
  color:#777;
}

/* =========================
   FOOTER
========================= */

footer{
  text-align:center;
  padding:25px;
  color:#777;
  font-size:14px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .products-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:600px){

  header{
    align-items:flex-start;
  }

  .header-actions{
    width:100%;
  }

  .header-actions .btn{
    flex:1;
    text-align:center;
  }

  .container{
    padding:12px;
  }

  .profile-panel{
    padding:18px;
  }

  .profile-top{
    justify-content:center;
    text-align:center;
  }

  .profile-info{
    width:100%;
  }

  .profile-info h1{
    font-size:25px;
  }

  .contact-actions{
    justify-content:center;
  }

  .products-grid{
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<header>

  <div class="logo">

    Arewa Market

    <small>
      Seller Profile
    </small>

  </div>


  <div class="header-actions">

    <a
      href="./index.html"
      class="btn btn-light"
    >
      Marketplace
    </a>


    <a
      href="./login.html"
      id="loginBtn"
      class="btn btn-gold"
    >
      Login
    </a>


    <a
      href="./seller-dashboard.html"
      id="dashboardBtn"
      class="btn btn-gold"
      style="display:none;"
    >
      Seller Dashboard
    </a>


    <button
      id="logoutBtn"
      class="btn btn-danger"
      style="display:none;"
    >
      Logout
    </button>

  </div>

</header>



<div class="container">


  <div
    id="message"
    class="message"
  ></div>


  <div
    id="profilePanel"
    class="profile-panel"
  >

    <div class="loading">
      Loading seller profile...
    </div>

  </div>



  <div class="products-panel">

    <div class="products-header">

      <h2>
        Seller Products
      </h2>

      <div
        id="productsCount"
        class="products-count"
      >
        Loading...
      </div>

    </div>


    <div id="productsContainer">

      <div class="loading">
        Loading products...
      </div>

    </div>

  </div>


</div>



<footer>

  © 2026 Arewa Market -
  Kasuwar Arewa a Hannunka

</footer>



<script type="module">


/* =========================================
   FIREBASE
========================================= */

import {
  auth,
  db
} from "./firebase.js";


import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  doc,
  getDoc,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* =========================================
   ELEMENTS
========================================= */

const profilePanel =
  document.getElementById(
    "profilePanel"
  );


const productsContainer =
  document.getElementById(
    "productsContainer"
  );


const productsCount =
  document.getElementById(
    "productsCount"
  );


const messageBox =
  document.getElementById(
    "message"
  );


const loginBtn =
  document.getElementById(
    "loginBtn"
  );


const dashboardBtn =
  document.getElementById(
    "dashboardBtn"
  );


const logoutBtn =
  document.getElementById(
    "logoutBtn"
  );



/* =========================================
   SELLER ID
========================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const sellerId =
  params.get("id");



/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
  auth,
  (user) => {

    if(user){

      loginBtn.style.display =
        "none";

      logoutBtn.style.display =
        "inline-block";


      loadCurrentUser(user);

    }else{

      loginBtn.style.display =
        "inline-block";

      dashboardBtn.style.display =
        "none";

      logoutBtn.style.display =
        "none";

    }

  }
);



/* =========================================
   CURRENT USER
========================================= */

async function loadCurrentUser(user){

  try{

    const userSnap =
      await getDoc(
        doc(
          db,
          "users",
          user.uid
        )
      );


    if(!userSnap.exists()){

      return;

    }


    const data =
      userSnap.data();


    if(
      data.role === "seller" &&
      data.isSeller === true &&
      data.sellerStatus === "approved"
    ){

      dashboardBtn.style.display =
        "inline-block";

    }

  }catch(error){

    console.error(
      "Current user error:",
      error
    );

  }

}



/* =========================================
   LOAD SELLER PROFILE
========================================= */

async function loadSeller(){

  if(!sellerId){

    showError(
      "Seller profile link is missing."
    );

    productsCount.textContent =
      "0 products";

    productsContainer.innerHTML =
      `
      <div class="empty">
        Seller profile link is missing.
      </div>
      `;

    return;

  }


  try{

    const sellerSnap =
      await getDoc(
        doc(
          db,
          "users",
          sellerId
        )
      );


    if(!sellerSnap.exists()){

      showError(
        "Seller profile not found."
      );

      productsCount.textContent =
        "0 products";

      productsContainer.innerHTML =
        `
        <div class="empty">
          Seller not found.
        </div>
        `;

      return;

    }


    const seller =
      sellerSnap.data();


    if(
      seller.role !== "seller" ||
      seller.isSeller !== true ||
      seller.sellerStatus !== "approved"
    ){

      showError(
        "This seller profile is not available."
      );

      productsCount.textContent =
        "0 products";

      productsContainer.innerHTML =
        `
        <div class="empty">
          Seller profile is not available.
        </div>
        `;

      return;

    }


    renderSeller(seller);


    await loadSellerProducts();

  }catch(error){

    console.error(error);

    showError(
      "Failed to load seller profile: " +
      error.message
    );

  }

}



/* =========================================
   RENDER SELLER PROFILE
========================================= */

function renderSeller(seller){

  const name =
    seller.name ||
    "Seller";


  const business =
    seller.businessName ||
    "Arewa Market Seller";


  const profileImage =
    seller.profileImageUrl ||
    "https://via.placeholder.com/150?text=Seller";


  const phone =
    seller.phone ||
    "";


  const whatsapp =
    seller.whatsapp ||
    "";


  const location =
    seller.location ||
    "-";


  const description =
    seller.businessDescription ||
    "This seller has not added a business description yet.";


  let contactButtons = "";


  if(phone){

    const phoneNumber =
      phone.replace(
        /[^0-9+]/g,
        ""
      );


    contactButtons += `

      <a
        class="btn btn-green"
        href="tel:${escapeHtml(phoneNumber)}"
      >
        📞 Call Seller
      </a>

    `;

  }


  if(whatsapp){

    let whatsappNumber =
      whatsapp.replace(
        /[^0-9]/g,
        ""
      );


    if(
      whatsappNumber.startsWith("0")
    ){

      whatsappNumber =
        "234" +
        whatsappNumber.substring(1);

    }


    contactButtons += `

      <a
        class="btn btn-gold"
        href="https://wa.me/${escapeHtml(whatsappNumber)}"
        target="_blank"
        rel="noopener"
      >
        💬 WhatsApp
      </a>

    `;

  }


  profilePanel.innerHTML = `

    <div class="profile-top">

      <img
        class="profile-image"
        src="${escapeHtml(profileImage)}"
        alt="${escapeHtml(name)}"
        onerror="
          this.src='https://via.placeholder.com/150?text=Seller'
        "
      >


      <div class="profile-info">

        <h1>
          ${escapeHtml(name)}
        </h1>


        <div class="business-name">
          ${escapeHtml(business)}
        </div>


        <div class="profile-detail">

          <strong>
            📍 Location:
          </strong>

          ${escapeHtml(location)}

        </div>


        ${
          phone
          ?
          `
          <div class="profile-detail">

            <strong>
              📞 Phone:
            </strong>

            ${escapeHtml(phone)}

          </div>
          `
          :
          ""
        }


        ${
          whatsapp
          ?
          `
          <div class="profile-detail">

            <strong>
              💬 WhatsApp:
            </strong>

            ${escapeHtml(whatsapp)}

          </div>
          `
          :
          ""
        }


        <div class="profile-detail">

          <span class="status status-approved">
            Approved Seller
          </span>

        </div>


        <div class="description">

          ${escapeHtml(description)}

        </div>


        <div class="contact-actions">

          ${contactButtons}

        </div>

      </div>

    </div>

  `;

}



/* =========================================
   LOAD SELLER PRODUCTS
========================================= */

async function loadSellerProducts(){

  productsContainer.innerHTML =
    `
    <div class="loading">
      Loading products...
    </div>
    `;


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "products"
        )
      );


    const products = [];


    snapshot.forEach(
      (productDoc) => {

        const data =
          productDoc.data();


        if(
          data.sellerId === sellerId &&
          data.status === "active"
        ){

          products.push({

            id:
              productDoc.id,

            ...data

          });

        }

      }
    );


    productsCount.textContent =
      products.length +
      (
        products.length === 1
          ? " product"
          : " products"
      );


    if(products.length === 0){

      productsContainer.innerHTML =
        `
        <div class="empty">

          <h3>
            No active products yet
          </h3>

          <p>
            This seller has not published
            any active products.
          </p>

        </div>
        `;

      return;

    }


    productsContainer.innerHTML =
      `
      <div class="products-grid">

        ${products
          .map(productCard)
          .join("")
        }

      </div>
      `;

  }catch(error){

    console.error(error);

    productsCount.textContent =
      "Unable to load";


    productsContainer.innerHTML =
      `
      <div class="empty">

        Failed to load seller products.

      </div>
      `;

  }

}



/* =========================================
   PRODUCT CARD
========================================= */

function productCard(product){

  const image =
    product.imageUrl ||
    "https://via.placeholder.com/500x300?text=No+Image";


  const price =
    Number(
      product.price || 0
    ).toLocaleString();


  return `

    <div class="product-card">

      <img
        class="product-image"
        src="${escapeHtml(image)}"
        alt="${escapeHtml(product.name || "Product")}"
        onerror="
          this.src='https://via.placeholder.com/500x300?text=No+Image'
        "
      >


      <div class="product-body">

        <h3>
          ${escapeHtml(
            product.name ||
            "Unnamed Product"
          )}
        </h3>


        <div class="price">
          ₦${price}
        </div>


        <div class="product-meta">

          <strong>
            Category:
          </strong>

          ${escapeHtml(
            product.category ||
            "-"
          )}

        </div>


        <div class="product-meta">

          <strong>
            Location:
          </strong>

          ${escapeHtml(
            product.location ||
            "-"
          )}

        </div>


        <div class="product-description">

          ${escapeHtml(
            product.description ||
            "No description."
          )}

        </div>


        <a
          class="view-product"
          href="product.html?id=${encodeURIComponent(product.id)}"
        >
          View Product →
        </a>

      </div>

    </div>

  `;

}



/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =========================================
   ERROR
========================================= */

function showError(text){

  messageBox.textContent =
    text;

  messageBox.className =
    "message error";

}



/* =========================================
   LOGOUT
========================================= */

logoutBtn.addEventListener(
  "click",
  async () => {

    try{

      await signOut(auth);

      window.location.replace(
        "index.html"
      );

    }catch(error){

      console.error(error);

      showError(
        "Logout failed: " +
        error.message
      );

    }

  }
);



/* =========================================
   START
========================================= */

loadSeller();

</script>

</body>
</html>

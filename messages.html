<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Arewa Market - Messages</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7f5;
  color:#222;
}

/* =========================
   HEADER
========================= */

header{
  background:#087f5b;
  color:white;
  padding:15px 20px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:15px;
  flex-wrap:wrap;

  box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo small{
  display:block;
  font-size:12px;
  font-weight:normal;
  margin-top:3px;
}

.header-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  padding:10px 15px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
  text-decoration:none;
  display:inline-block;
}

.btn-light{
  background:white;
  color:#087f5b;
}

.btn-gold{
  background:#d4a017;
  color:white;
}

.btn-danger{
  background:#dc3545;
  color:white;
}

.btn:hover{
  opacity:.9;
}

/* =========================
   PAGE
========================= */

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

/* =========================
   MESSAGE NOTICE
========================= */

.notice{
  display:none;
  padding:12px 15px;
  border-radius:7px;
  margin-bottom:15px;
  font-size:14px;
}

.notice.error{
  display:block;
  background:#f8d7da;
  color:#721c24;
}

.notice.success{
  display:block;
  background:#d4edda;
  color:#155724;
}

/* =========================
   MESSAGING APP
========================= */

.messaging{
  height:650px;
  min-height:0;

  background:white;
  border-radius:12px;
  overflow:hidden;

  box-shadow:0 3px 15px rgba(0,0,0,.1);

  display:grid;
  grid-template-columns:330px minmax(0,1fr);
}

/* =========================
   INBOX
========================= */

.inbox{
  border-right:1px solid #ddd;

  display:flex;
  flex-direction:column;

  min-width:0;
  min-height:0;
}

.inbox-header{
  flex:0 0 auto;

  padding:18px;
  border-bottom:1px solid #ddd;
}

.inbox-header h2{
  color:#087f5b;
  font-size:20px;
  margin-bottom:12px;
}

.search{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:7px;
  outline:none;
}

.search:focus{
  border-color:#087f5b;
}

.conversations{
  flex:1 1 auto;

  min-height:0;

  overflow-y:auto;
  overflow-x:hidden;

  -webkit-overflow-scrolling:touch;
}

.conversation{
  padding:14px;
  border-bottom:1px solid #eee;

  cursor:pointer;

  display:flex;
  gap:11px;
  align-items:center;

  transition:.15s;
}

.conversation:hover{
  background:#f5f9f7;
}

.conversation.active{
  background:#e8f5ef;
}

.avatar{
  width:48px;
  height:48px;
  min-width:48px;

  border-radius:50%;

  background:#087f5b;
  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:bold;
  font-size:18px;

  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.conversation-info{
  min-width:0;
  flex:1;
}

.conversation-top{
  display:flex;
  justify-content:space-between;
  gap:5px;
}

.conversation-name{
  font-weight:bold;
  color:#222;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.conversation-time{
  color:#888;
  font-size:10px;
  white-space:nowrap;
}

.last-message{
  color:#777;
  font-size:12px;
  margin-top:5px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.unread{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-width:20px;
  height:20px;

  padding:0 5px;

  border-radius:20px;

  background:#d4a017;
  color:white;

  font-size:11px;
  font-weight:bold;

  margin-left:5px;
}

/* =========================
   CHAT
========================= */

.chat{
  display:flex;
  flex-direction:column;

  min-width:0;
  min-height:0;

  overflow:hidden;
}

.chat-empty{
  flex:1 1 auto;

  min-height:0;

  display:flex;
  justify-content:center;
  align-items:center;

  text-align:center;

  color:#777;

  padding:30px;
}

.chat-empty h3{
  color:#087f5b;
  margin-bottom:8px;
}

.chat-header{
  flex:0 0 auto;

  padding:14px 18px;

  border-bottom:1px solid #ddd;

  display:flex;
  align-items:center;

  gap:12px;

  background:white;

  position:relative;
  z-index:2;
}

.chat-user{
  min-width:0;
  flex:1;
}

.chat-user h3{
  color:#087f5b;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-user p{
  color:#777;
  font-size:12px;
  margin-top:3px;
}

/* =========================
   MESSAGES AREA
========================= */

.messages{
  flex:1 1 auto;

  min-height:0;

  padding:18px;

  overflow-y:auto;
  overflow-x:hidden;

  background:#f7faf8;

  -webkit-overflow-scrolling:touch;

  overscroll-behavior:contain;

  scroll-behavior:smooth;
}

.message-row{
  display:flex;
  margin-bottom:12px;
}

.message-row.mine{
  justify-content:flex-end;
}

.message-row.theirs{
  justify-content:flex-start;
}

.bubble{
  max-width:72%;

  padding:10px 13px;

  border-radius:12px;

  line-height:1.5;

  font-size:14px;

  position:relative;

  word-wrap:break-word;
  overflow-wrap:anywhere;
}

.mine .bubble{
  background:#087f5b;
  color:white;

  border-bottom-right-radius:3px;
}

.theirs .bubble{
  background:white;
  color:#222;

  border:1px solid #e3e3e3;

  border-bottom-left-radius:3px;
}

.message-time{
  display:block;

  font-size:9px;

  margin-top:5px;

  opacity:.7;

  text-align:right;
}

/* =========================
   INPUT
========================= */

.chat-input{
  flex:0 0 auto;

  border-top:1px solid #ddd;

  padding:12px;

  background:white;

  display:flex;

  gap:8px;

  position:relative;

  z-index:5;
}

.chat-input textarea{
  flex:1 1 auto;

  min-width:0;

  resize:none;

  height:45px;

  padding:12px;

  border:1px solid #ddd;

  border-radius:8px;

  outline:none;

  font-family:Arial,sans-serif;

  font-size:14px;
}

.chat-input textarea:focus{
  border-color:#087f5b;
}

.send-btn{
  flex:0 0 auto;

  border:none;

  background:#087f5b;

  color:white;

  padding:0 18px;

  border-radius:8px;

  font-weight:bold;

  cursor:pointer;
}

.send-btn:hover{
  background:#075f43;
}

.send-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* =========================
   LOADING
========================= */

.loading{
  text-align:center;
  padding:30px;
  color:#087f5b;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:30px 20px;
  color:#777;
}

.empty h3{
  color:#087f5b;
  margin-bottom:7px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  html,
  body{
    width:100%;
    height:100%;
    overflow:hidden;
  }

  body{
    position:fixed;
    left:0;
    top:0;
    right:0;
    bottom:0;
  }

  header{
    height:auto;

    padding:10px 12px;

    gap:8px;
  }

  .logo{
    font-size:18px;
  }

  .logo small{
    font-size:10px;
  }

  .header-actions{
    gap:5px;
  }

  .header-actions .btn{
    padding:8px 10px;
    font-size:12px;
  }

  .container{
    width:100%;

    height:calc(
      100dvh - 86px
    );

    min-height:0;

    padding:8px;
  }

  .messaging{
    width:100%;
    height:100%;

    min-height:0;

    border-radius:10px;

    grid-template-columns:1fr;

    overflow:hidden;
  }

  .inbox{
    width:100%;
    height:100%;

    min-height:0;

    border-right:none;
  }

  .inbox-header{
    padding:12px;
  }

  .inbox-header h2{
    font-size:18px;
    margin-bottom:9px;
  }

  .conversations{
    min-height:0;

    overflow-y:auto;
    overflow-x:hidden;

    -webkit-overflow-scrolling:touch;
  }

  .chat{
    width:100%;
    height:100%;

    min-height:0;

    display:none;

    overflow:hidden;
  }

  .messaging.chat-open .inbox{
    display:none;
  }

  .messaging.chat-open .chat{
    display:flex;
  }

  #chatContent{
    width:100%;

    height:100% !important;

    min-height:0;

    display:flex;

    flex-direction:column;

    overflow:hidden;
  }

  .chat-header{
    flex:0 0 auto;

    min-height:58px;

    padding:9px;
  }

  .back-btn{
    display:inline-block !important;

    flex:0 0 auto;
  }

  .chat-user{
    min-width:0;
    flex:1;
  }

  .chat-user h3{
    font-size:16px;
  }

  .messages{
    flex:1 1 auto;

    min-height:0;

    height:auto;

    padding:14px 9px;

    overflow-y:auto;
    overflow-x:hidden;

    -webkit-overflow-scrolling:touch;

    overscroll-behavior:contain;

    scroll-behavior:smooth;
  }

  .message-row{
    margin-bottom:9px;
  }

  .bubble{
    max-width:85%;

    padding:9px 11px;

    font-size:14px;
  }

  .chat-input{
    flex:0 0 auto;

    width:100%;

    padding:8px;

    gap:6px;

    padding-bottom:calc(
      8px + env(safe-area-inset-bottom)
    );
  }

  .chat-input textarea{
    min-width:0;

    height:44px;

    max-height:100px;

    padding:11px;

    font-size:14px;
  }

  .send-btn{
    flex:0 0 auto;

    min-height:44px;

    padding:0 14px;
  }

}

/* =========================
   VERY SMALL PHONES
========================= */

@media(max-width:380px){

  .header-actions .btn{
    padding:7px 8px;
    font-size:11px;
  }

  .container{
    height:calc(
      100dvh - 78px
    );

    padding:5px;
  }

  .bubble{
    max-width:88%;
  }

  .chat-input textarea{
    font-size:13px;
  }

  .send-btn{
    padding:0 11px;
    font-size:12px;
  }

}

/* =========================
   DESKTOP
========================= */

@media(min-width:701px){

  .back-btn{
    display:none !important;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

  <div class="logo">

    Arewa Market

    <small>
      Messages
    </small>

  </div>


  <div class="header-actions">

    <a
      href="./index.html"
      class="btn btn-light"
    >
      Marketplace
    </a>


    <a
      href="./seller-dashboard.html"
      id="dashboardBtn"
      class="btn btn-gold"
      style="display:none;"
    >
      Seller Dashboard
    </a>


    <button
      id="logoutBtn"
      class="btn btn-danger"
      style="display:none;"
    >
      Logout
    </button>

  </div>

</header>



<!-- =========================
     MAIN
========================= -->

<div class="container">


  <div
    id="notice"
    class="notice"
  ></div>


  <div
    id="messaging"
    class="messaging"
  >


    <!-- =========================
         INBOX
    ========================= -->

    <aside class="inbox">

      <div class="inbox-header">

        <h2>
          💬 Messages
        </h2>


        <input
          type="text"
          id="conversationSearch"
          class="search"
          placeholder="Search conversations..."
        >

      </div>


      <div
        id="conversations"
        class="conversations"
      >

        <div class="loading">
          Loading messages...
        </div>

      </div>

    </aside>



    <!-- =========================
         CHAT
    ========================= -->

    <section class="chat">


      <div
        id="chatEmpty"
        class="chat-empty"
      >

        <div>

          <h3>
            Select a conversation
          </h3>

          <p>
            Choose a seller or buyer from
            your messages to start chatting.
          </p>

        </div>

      </div>



      <div
        id="chatContent"
        style="display:none; height:100%; flex-direction:column;"
      >


        <!-- CHAT HEADER -->

        <div class="chat-header">

          <button
            id="backBtn"
            class="btn btn-light back-btn"
            type="button"
          >
            ←
          </button>


          <div
            id="chatAvatar"
            class="avatar"
          >
            ?
          </div>


          <div class="chat-user">

            <h3 id="chatName">
              User
            </h3>

            <p id="chatRole">
              Arewa Market
            </p>

          </div>

        </div>



        <!-- MESSAGES -->

        <div
          id="messages"
          class="messages"
        >

        </div>



        <!-- INPUT -->

        <form
          id="messageForm"
          class="chat-input"
        >

          <textarea
            id="messageInput"
            placeholder="Type a message..."
            maxlength="2000"
          ></textarea>

            type="submit"
            id="sendBtn"
            class="send-btn"
          >
            Send
          </button>

        </form>


      </div>

    </section>

  </div>

</div>



<script type="module">


/* =========================================
   FIREBASE
========================================= */

import {
  auth,
  db
} from "./firebase.js";


import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  collection,
  doc,
  getDoc,
  getDocs,
  addDoc,
  setDoc,
  updateDoc,
  query,
  where,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* =========================================
   ELEMENTS
========================================= */

const messaging =
  document.getElementById(
    "messaging"
  );


const conversationsContainer =
  document.getElementById(
    "conversations"
  );


const conversationSearch =
  document.getElementById(
    "conversationSearch"
  );


const chatEmpty =
  document.getElementById(
    "chatEmpty"
  );


const chatContent =
  document.getElementById(
    "chatContent"
  );


const chatAvatar =
  document.getElementById(
    "chatAvatar"
  );


const chatName =
  document.getElementById(
    "chatName"
  );


const chatRole =
  document.getElementById(
    "chatRole"
  );


const messagesContainer =
  document.getElementById(
    "messages"
  );


const messageForm =
  document.getElementById(
    "messageForm"
  );


const messageInput =
  document.getElementById(
    "messageInput"
  );


const sendBtn =
  document.getElementById(
    "sendBtn"
  );


const notice =
  document.getElementById(
    "notice"
  );


const dashboardBtn =
  document.getElementById(
    "dashboardBtn"
  );


const logoutBtn =
  document.getElementById(
    "logoutBtn"
  );


const backBtn =
  document.getElementById(
    "backBtn"
  );



/* =========================================
   STATE
========================================= */

let currentUser = null;

let currentUserData = null;

let currentConversationId = null;

let currentOtherUserId = null;

let conversations = [];

let unsubscribeConversations = null;

let unsubscribeMessages = null;



/* =========================================
   URL
========================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const requestedSellerId =
  params.get("sellerId");



/* =========================================
   NOTICE
========================================= */

function showNotice(
  text,
  type = "error"
){

  notice.textContent =
    text;

  notice.className =
    "notice " + type;


  setTimeout(() => {

    notice.className =
      "notice";

  },4000);

}



/* =========================================
   AUTH
========================================= */

onAuthStateChanged(
  auth,
  async (user) => {

    currentUser = user;


    if(!user){

      window.location.href =
        "login.html?returnUrl=" +
        encodeURIComponent(
          window.location.href
        );

      return;

    }


    logoutBtn.style.display =
      "inline-block";


    try{

      const userSnap =
        await getDoc(
          doc(
            db,
            "users",
            user.uid
          )
        );


      if(userSnap.exists()){

        currentUserData =
          userSnap.data();


        if(
          currentUserData.role === "seller" &&
          currentUserData.isSeller === true &&
          currentUserData.sellerStatus === "approved"
        ){

          dashboardBtn.style.display =
            "inline-block";

        }

      }


      startConversations();


    }catch(error){

      console.error(
        "User error:",
        error
      );

      showNotice(
        "Unable to load your account."
      );

    }

  }
);



/* =========================================
   START CONVERSATIONS
========================================= */

function startConversations(){

  if(unsubscribeConversations){

    unsubscribeConversations();

  }


  const conversationsRef =
    collection(
      db,
      "conversations"
    );


  const q =
  query(
    conversationsRef,
    where(
      "participantIds",
      "array-contains",
      currentUser.uid
    ),
    orderBy(
      "lastMessageAt",
      "desc"
    )
  );


  unsubscribeConversations =
    onSnapshot(
      q,
      async (snapshot) => {

        conversations = [];


        for(
          const conversationDoc
          of snapshot.docs
        ){

          const data =
            conversationDoc.data();


          const otherUserId =
            data.participantIds &&
            data.participantIds.find(
              id =>
                id !== currentUser.uid
            );


          if(!otherUserId){

            continue;

          }


          let otherUser = null;


          try{

            const userSnap =
              await getDoc(
                doc(
                  db,
                  "users",
                  otherUserId
                )
              );


            if(userSnap.exists()){

              otherUser = {

                id:
                  otherUserId,

                ...userSnap.data()

              };

            }

          }catch(error){

            console.error(
              "Other user error:",
              error
            );

          }


          conversations.push({

            id:
              conversationDoc.id,

            ...data,

            otherUser

          });

        }


        renderConversations();


        /*
          If sellerId was passed from
          seller-profile.html, automatically
          open that seller's conversation.
        */

        if(
          requestedSellerId &&
          !currentConversationId
        ){

          await openOrCreateConversation(
            requestedSellerId
          );

        }

      },
      (error) => {

        console.error(
          "Conversation listener error:",
          error
        );


        showNotice(
          "Unable to load messages: " +
          error.message
        );

      }
    );

}



/* =========================================
   RENDER CONVERSATIONS
========================================= */

function renderConversations(){

  const search =
    conversationSearch.value
      .trim()
      .toLowerCase();


  let list =
    conversations.filter(
      conversation => {

        if(!search){

          return true;

        }


        const user =
          conversation.otherUser || {};


        const name =
          String(
            user.name ||
            user.businessName ||
            ""
          ).toLowerCase();


        const lastMessage =
          String(
            conversation.lastMessage ||
            ""
          ).toLowerCase();


        return (
          name.includes(search) ||
          lastMessage.includes(search)
        );

      }
    );


  if(!list.length){

    conversationsContainer.innerHTML = `

      <div class="empty">

        <h3>
          No messages yet
        </h3>

        <p>
          Start a conversation with a seller.
        </p>

      </div>

    `;

    return;

  }


  conversationsContainer.innerHTML =
    list.map(
      conversationItem
    ).join("");


  document
    .querySelectorAll(
      ".conversation"
    )
    .forEach(item => {

      item.addEventListener(
        "click",
        () => {

          openConversation(
            item.dataset.id
          );

        }
      );

    });

}



/* =========================================
   CONVERSATION ITEM
========================================= */

function conversationItem(
  conversation
){

  const user =
    conversation.otherUser || {};


  const name =
    user.businessName ||
    user.name ||
    "Arewa Market User";


  const initial =
    name
      .charAt(0)
      .toUpperCase();


  const unread =
    Number(
      conversation.unreadCount &&
      conversation.unreadCount[currentUser.uid]
        ? conversation.unreadCount[currentUser.uid]
        : 0
    );


  const active =
    conversation.id ===
    currentConversationId
      ? "active"
      : "";


  return `

    <div
      class="conversation ${active}"
      data-id="${escapeHtml(conversation.id)}"
    >

      <div class="avatar">

        ${
          user.profileImageUrl
          ?
          `
          <img
            src="${escapeHtml(
              user.profileImageUrl
            )}"
            alt="${escapeHtml(name)}"
            onerror="
              this.style.display='none'
            "
          >
          `
          :
          escapeHtml(initial)
        }

      </div>


      <div class="conversation-info">

        <div class="conversation-top">

          <div class="conversation-name">

            ${escapeHtml(name)}

            ${
              unread > 0
              ?
              `
              <span class="unread">
                ${unread > 99 ? "99+" : unread}
              </span>
              `
              :
              ""
            }

          </div>


          <div class="conversation-time">

            ${formatTime(
              conversation.lastMessageAt
            )}

          </div>

        </div>


        <div class="last-message">

          ${escapeHtml(
            conversation.lastMessage ||
            "No messages yet"
          )}

        </div>

      </div>

    </div>

  `;

}



/* =========================================
   OPEN OR CREATE CONVERSATION
========================================= */

async function openOrCreateConversation(
  otherUserId
){

  if(!currentUser){

    return;

  }


  if(
    otherUserId === currentUser.uid
  ){

    showNotice(
      "You cannot message yourself."
    );

    return;

  }


  try{

    /*
      Find existing conversation
      between the two users.
    */

    let existing =
      conversations.find(
        conversation => {

          return (
            conversation.participantIds &&
            conversation.participantIds.includes(
              otherUserId
            )
          );

        }
      );


    if(existing){

      openConversation(
        existing.id
      );

      return;

    }


    /*
      Load other user.
    */

    const userSnap =
      await getDoc(
        doc(
          db,
          "users",
          otherUserId
        )
      );


    if(!userSnap.exists()){

      showNotice(
        "Seller profile not found."
      );

      return;

    }


    const otherUser =
      userSnap.data();


    if(
      otherUser.role === "seller" &&
      (
        otherUser.isSeller !== true ||
        otherUser.sellerStatus !== "approved"
      )
    ){

      showNotice(
        "This seller is not available."
      );

      return;

    }


    /*
      Create conversation.
    */

    const conversationRef =
      await addDoc(
        collection(
          db,
          "conversations"
        ),
        {

          participantIds:[
            currentUser.uid,
            otherUserId
          ],

          participants:[
            currentUser.uid,
            otherUserId
          ],

          lastMessage:"",
          lastMessageAt:
            serverTimestamp(),

          unreadCount:{
            [currentUser.uid]:0,
            [otherUserId]:0
          },

          createdAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp()

        }
      );


    currentConversationId =
      conversationRef.id;


    currentOtherUserId =
      otherUserId;


    await displayChatUser(
      otherUserId
    );


    subscribeToMessages(
      conversationRef.id
    );


  }catch(error){

    console.error(
      "Create conversation error:",
      error
    );


    showNotice(
      "Unable to start conversation: " +
      error.message
    );

  }

}



/* =========================================
   OPEN CONVERSATION
========================================= */

async function openConversation(
  conversationId
){

  const conversation =
    conversations.find(
      item =>
        item.id === conversationId
    );


  if(!conversation){

    return;

  }


  currentConversationId =
    conversationId;


  currentOtherUserId =
    conversation.otherUser &&
    conversation.otherUser.id;


  renderConversations();


  await displayChatUser(
    currentOtherUserId
  );


  subscribeToMessages(
    conversationId
  );


  /*
    Reset unread count for current user.
  */

  if(
    conversation.unreadCount &&
    Number(
      conversation.unreadCount[currentUser.uid] || 0
    ) > 0
  ){

    try{

      await updateDoc(
        doc(
          db,
          "conversations",
          conversationId
        ),
        {

          [`unreadCount.${currentUser.uid}`]:
            0,

          updatedAt:
            serverTimestamp()

        }
      );

    }catch(error){

      console.error(
        "Unread update error:",
        error
      );

    }

  }


  if(
    window.innerWidth <= 700
  ){

    messaging.classList.add(
      "chat-open"
    );

  }

}



/* =========================================
   DISPLAY CHAT USER
========================================= */

async function displayChatUser(
  userId
){

  if(!userId){

    return;

  }


  try{

    const userSnap =
      await getDoc(
        doc(
          db,
          "users",
          userId
        )
      );


    if(!userSnap.exists()){

      return;

    }


    const user =
      userSnap.data();


    const name =
      user.businessName ||
      user.name ||
      "Arewa Market User";


    const initial =
      name
        .charAt(0)
        .toUpperCase();


    chatName.textContent =
      name;


    chatRole.textContent =
      user.role === "seller"
        ? "Seller"
        : "Buyer";


    if(user.profileImageUrl){

      chatAvatar.innerHTML = `

        <img
          src="${escapeHtml(
            user.profileImageUrl
          )}"
          alt="${escapeHtml(name)}"
          onerror="
            this.style.display='none'
          "
        >

      `;

    }else{

      chatAvatar.textContent =
        initial;

    }


    chatEmpty.style.display =
      "none";


    chatContent.style.display =
      "flex";

  }catch(error){

    console.error(
      "Display user error:",
      error
    );

  }

}



/* =========================================
   SUBSCRIBE MESSAGES
========================================= */

function subscribeToMessages(
  conversationId
){

  if(unsubscribeMessages){

    unsubscribeMessages();

  }


  messagesContainer.innerHTML = `

    <div class="loading">
      Loading messages...
    </div>

  `;


  const messagesRef =
    collection(
      db,
      "conversations",
      conversationId,
      "messages"
    );


  const q =
    query(
      messagesRef,
      orderBy(
        "createdAt",
        "asc"
      )
    );


  unsubscribeMessages =
    onSnapshot(
      q,
      (snapshot) => {

        messagesContainer.innerHTML =
          "";


        if(snapshot.empty){

          messagesContainer.innerHTML = `

            <div class="empty">

              <h3>
                Start the conversation
              </h3>

              <p>
                Send your first message below.
              </p>

            </div>

          `;

          return;

        }


        snapshot.forEach(
          messageDoc => {

            renderMessage(
              messageDoc.data()
            );

          }
        );


        requestAnimationFrame(() => {

          messagesContainer.scrollTop =
            messagesContainer.scrollHeight;

        });

      },
      (error) => {

        console.error(
          "Messages listener error:",
          error
        );


        messagesContainer.innerHTML = `

          <div class="empty">

            Unable to load messages.

          </div>

        `;

      }
    );

}



/* =========================================
   RENDER MESSAGE
========================================= */

function renderMessage(
  message
){

  const mine =
    message.senderId ===
    currentUser.uid;


  const row =
    document.createElement(
      "div"
    );


  row.className =
    "message-row " +
    (
      mine
        ? "mine"
        : "theirs"
    );


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  const text =
    document.createElement(
      "div"
    );


  text.textContent =
    message.text || "";


  const time =
    document.createElement(
      "span"
    );


  time.className =
    "message-time";


  time.textContent =
    formatTime(
      message.createdAt
    );


  bubble.appendChild(
    text
  );


  bubble.appendChild(
    time
  );


  row.appendChild(
    bubble
  );


  messagesContainer.appendChild(
    row
  );

}



/* =========================================
   SEND MESSAGE
========================================= */

messageForm.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    const text =
      messageInput.value.trim();


    if(!text){

      return;

    }


    if(
      !currentUser ||
      !currentConversationId ||
      !currentOtherUserId
    ){

      showNotice(
        "Please select a conversation."
      );

      return;

    }


    sendBtn.disabled =
      true;


    try{

      const messagesRef =
        collection(
          db,
          "conversations",
          currentConversationId,
          "messages"
        );


      await addDoc(
        messagesRef,
        {

          senderId:
            currentUser.uid,

          receiverId:
            currentOtherUserId,

          text:
            text,

          createdAt:
            serverTimestamp(),

          read:false

        }
      );


      const conversationRef =
        doc(
          db,
          "conversations",
          currentConversationId
        );


      const conversationSnap =
        await getDoc(
          conversationRef
        );


      let currentUnread = 0;


      if(conversationSnap.exists()){

        const data =
          conversationSnap.data();


        currentUnread =
          Number(
            data.unreadCount &&
            data.unreadCount[
              currentOtherUserId
            ]
              ? data.unreadCount[
                  currentOtherUserId
                ]
              : 0
          );

      }


      await updateDoc(
        conversationRef,
        {

          lastMessage:
            text,

          lastMessageAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp(),

          [`unreadCount.${currentUser.uid}`]:
            0,

          [`unreadCount.${currentOtherUserId}`]:
            currentUnread + 1

        }
      );


      messageInput.value =
        "";


    }catch(error){

      console.error(
        "Send message error:",
        error
      );


      showNotice(
        "Message could not be sent: " +
        error.message
      );

    }


    sendBtn.disabled =
      false;


    messageInput.focus();

  }
);

conversationSearch.addEventListener(

    renderConversations();

);

logoutBtn.addEventListener(

    try{

      if(unsubscribeConversations){

        unsubscribeConversations();

      }


      if(unsubscribeMessages){

        unsubscribeMessages();

      }


      await signOut(auth);


      window.location.href =
        "index.html";

    }catch(error){

      console.error(
        "Logout error:",
        error
      );


      showNotice(
        "Logout failed."
      );

    }

  }
);



/* =========================================
   FORMAT TIME
========================================= */

function formatTime(
  timestamp
){

  if(
    !timestamp ||
    !timestamp.toDate
  ){

    return "";

  }


  const date =
    timestamp.toDate();


  const now =
    new Date();


  const sameDay =
    date.toDateString() ===
    now.toDateString();


  if(sameDay){

    return date.toLocaleTimeString(
      "en-NG",
      {
        hour:"numeric",
        minute:"2-digit"
      }
    );

  }


  return date.toLocaleDateString(
    "en-NG",
    {
      day:"numeric",
      month:"short"
    }
  );

}



/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Arewa Market - Messages</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">


<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}


h1,h2,h3,.brand h1,.brand-name,.logo,.hero h2,.page-title,.auth-title,.box h2,.modal h2,.modal-title{
  font-family:'Playfair Display',Georgia,serif;
  letter-spacing:.2px;
}
html{
  width:100%;
  min-height:100%;
}

body{
  font-family:'Inter',Arial,sans-serif;
  background:#f8f6f3;
  color:#222;
}

/* =========================
   HEADER
========================= */

header{
  background:linear-gradient(135deg,#0d3b2c,#175e3f);
  color:white;
  padding:15px 20px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:15px;
  flex-wrap:wrap;

  box-shadow:0 2px 8px rgba(0,0,0,.15);
  border-bottom:3px solid #c9a227;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo small{
  display:block;
  font-size:12px;
  font-weight:normal;
  margin-top:3px;
}

.header-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  padding:10px 15px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
  text-decoration:none;
  display:inline-block;
}

.btn-light{
  background:white;
  color:#165d3c;
}

.btn-gold{
  background:#d19a1a;
  color:white;
}

.btn-danger{
  background:#dc3545;
  color:white;
}

.btn:hover{
  opacity:.9;
}

/* =========================
   PAGE
========================= */

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

/* =========================
   MESSAGE NOTICE
========================= */

.notice{
  display:none;
  padding:12px 15px;
  border-radius:7px;
  margin-bottom:15px;
  font-size:14px;
}

.notice.error{
  display:block;
  background:#f8d7da;
  color:#721c24;
}

.notice.success{
  display:block;
  background:#d4ede1;
  color:#124a30;
}

/* =========================
   MESSAGING APP
========================= */

.messaging{
  height:650px;
  min-height:0;

  background:white;
  border-radius:12px;
  overflow:hidden;

  box-shadow:0 3px 15px rgba(0,0,0,.1);

  display:grid;
  grid-template-columns:330px minmax(0,1fr);
}

/* =========================
   INBOX
========================= */

.inbox{
  border-right:1px solid #e3dfd7;

  display:flex;
  flex-direction:column;

  min-width:0;
  min-height:0;
}

.inbox-header{
  flex:0 0 auto;

  padding:18px;
  border-bottom:1px solid #e3dfd7;
}

.inbox-header h2{
  color:#165d3c;
  font-size:20px;
  margin-bottom:12px;
}

.search{
  width:100%;
  padding:11px;
  border:1px solid #e3dfd7;
  border-radius:7px;
  outline:none;
}

.search:focus{
  border-color:#165d3c;
}

.conversations{
  flex:1 1 auto;

  min-height:0;

  overflow-y:auto;
  overflow-x:hidden;

  -webkit-overflow-scrolling:touch;
}

.conversation{
  padding:14px;
  border-bottom:1px solid #f3f0e9;

  cursor:pointer;

  display:flex;
  gap:11px;
  align-items:center;

  transition:.15s;
}

.conversation:hover{
  background:#f9f8f5;
}

.conversation.active{
  background:#f4f0e9;
}

.avatar{
  width:48px;
  height:48px;
  min-width:48px;

  border-radius:50%;

  background:#165d3c;
  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:bold;
  font-size:18px;

  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.conversation-info{
  min-width:0;
  flex:1;
}

.conversation-top{
  display:flex;
  justify-content:space-between;
  gap:5px;
}

.conversation-name{
  font-weight:bold;
  color:#222;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.conversation-time{
  color:#888;
  font-size:10px;
  white-space:nowrap;
}

.last-message{
  color:#777;
  font-size:12px;
  margin-top:5px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.unread{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-width:20px;
  height:20px;

  padding:0 5px;

  border-radius:20px;

  background:#d19a1a;
  color:white;

  font-size:11px;
  font-weight:bold;

  margin-left:5px;
}

/* =========================
   CHAT
========================= */

.chat{
  display:flex;
  flex-direction:column;

  min-width:0;
  min-height:0;

  overflow:hidden;
}

.chat-empty{
  flex:1 1 auto;

  min-height:0;

  display:flex;
  justify-content:center;
  align-items:center;

  text-align:center;

  color:#777;

  padding:30px;
}

.chat-empty h3{
  color:#165d3c;
  margin-bottom:8px;
}

.chat-header{
  flex:0 0 auto;

  padding:14px 18px;

  border-bottom:1px solid #e3dfd7;

  display:flex;
  align-items:center;

  gap:12px;

  background:white;

  position:relative;
  z-index:2;
}

.chat-user{
  min-width:0;
  flex:1;
}

.chat-user h3{
  color:#165d3c;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-user p{
  color:#777;
  font-size:12px;
  margin-top:3px;
}

/* =========================
   MESSAGES AREA
========================= */

.messages{
  flex:1 1 auto;

  min-height:0;

  padding:18px;

  overflow-y:auto;
  overflow-x:hidden;

  background:#faf9f7;

  -webkit-overflow-scrolling:touch;

  overscroll-behavior:contain;

  scroll-behavior:smooth;
}

.message-row{
  display:flex;
  margin-bottom:12px;
}

.message-row.mine{
  justify-content:flex-end;
}

.message-row.theirs{
  justify-content:flex-start;
}

.bubble{
  max-width:72%;

  padding:10px 13px;

  border-radius:12px;

  line-height:1.5;

  font-size:14px;

  position:relative;

  word-wrap:break-word;
  overflow-wrap:anywhere;
}

.mine .bubble{
  background:#165d3c;
  color:white;

  border-bottom-right-radius:3px;
}

.theirs .bubble{
  background:white;
  color:#222;

  border:1px solid #e8e5de;

  border-bottom-left-radius:3px;
}

.message-time{
  display:block;

  font-size:9px;

  margin-top:5px;

  opacity:.7;

  text-align:right;
}

/* =========================
   INPUT
========================= */

.chat-input{
  flex:0 0 auto;

  border-top:1px solid #e3dfd7;

  padding:12px;

  background:white;

  display:flex;

  gap:8px;

  position:relative;

  z-index:5;
}

.chat-input textarea{
  flex:1 1 auto;

  min-width:0;

  resize:none;

  height:45px;

  padding:12px;

  border:1px solid #e3dfd7;

  border-radius:8px;

  outline:none;

  font-family:'Inter',Arial,sans-serif;

  font-size:14px;
}

.chat-input textarea:focus{
  border-color:#165d3c;
}

.send-btn{
  flex:0 0 auto;

  border:none;

  background:#165d3c;

  color:white;

  padding:0 18px;

  border-radius:8px;

  font-weight:bold;

  cursor:pointer;
}

.send-btn:hover{
  background:#10462d;
}

.send-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* =========================
   MESSAGE OPTIONS (delete)
========================= */

.msg-options-btn{
  position:absolute;
  top:-6px;
  right:-6px;

  width:22px;
  height:22px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:none;
  border-radius:50%;

  background:rgba(0,0,0,.15);
  color:inherit;

  font-size:14px;
  line-height:1;

  cursor:pointer;
}

.mine .msg-options-btn{
  background:rgba(255,255,255,.35);
}

.msg-options-menu{
  display:none;

  position:absolute;
  top:16px;
  right:0;

  z-index:5;

  background:white;
  color:#222;

  border-radius:8px;

  box-shadow:0 4px 14px rgba(0,0,0,.18);

  overflow:hidden;

  min-width:150px;
}

.msg-options-menu.show{
  display:flex;
  flex-direction:column;
}

.msg-options-menu button{
  border:none;
  background:none;

  padding:10px 14px;

  text-align:left;

  font-size:13px;

  color:#165d3c;

  cursor:pointer;
}

.msg-options-menu button:hover{
  background:#eaf3ee;
}

.msg-options-menu button.danger{
  color:#dc3545;
}

.msg-options-menu button.danger:hover{
  background:#fdeeee;
}

.deleted-message{
  font-style:italic;
  opacity:.7;
  font-size:13px;
}

/* =========================
   MEDIA ATTACH BUTTONS
   (photo / video / voice)
========================= */

.chat-media-btn{
  flex:0 0 auto;

  width:40px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:none;

  border-radius:50%;

  background:#eaf3ee;

  color:#165d3c;

  font-size:18px;

  cursor:pointer;

  transition:background .15s ease, transform .1s ease;
}

.chat-media-btn:hover{
  background:#165d3c;
  color:white;
}

.chat-media-btn:active{
  transform:scale(.92);
}

.chat-media-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.chat-media-btn.recording{
  background:#dc3545;
  color:white;
  animation:chatMicPulse 1.2s infinite;
}

@keyframes chatMicPulse{
  0%{ box-shadow:0 0 0 0 rgba(220,53,69,.45); }
  70%{ box-shadow:0 0 0 10px rgba(220,53,69,0); }
  100%{ box-shadow:0 0 0 0 rgba(220,53,69,0); }
}

/* =========================
   MEDIA PREVIEW CARDS
   (before sending)
========================= */

.chat-media-preview{
  display:none;
  align-items:center;
  gap:10px;

  padding:8px 10px;
  margin:0 12px 8px 12px;

  background:#fbf7ec;

  border:1px solid #eadfc0;
  border-left:3px solid #d19a1a;

  border-radius:10px;

  font-size:13px;

  color:#5a4b1f;
}

.chat-media-preview.show{
  display:flex;
}

.chat-media-preview img,
.chat-media-preview video{
  width:64px;
  height:64px;

  object-fit:cover;

  border-radius:8px;

  flex:0 0 auto;
}

.chat-media-preview audio{
  height:36px;
  max-width:190px;
}

.chat-media-status{
  flex:1 1 auto;

  font-weight:600;
}

.chat-media-remove{
  flex:0 0 auto;

  width:26px;
  height:26px;

  border:none;
  border-radius:50%;

  background:white;
  color:#dc3545;

  font-size:14px;

  cursor:pointer;
}

/* =========================
   RECORDING INDICATOR
========================= */

.chat-recording{
  display:none;
  align-items:center;
  gap:8px;

  padding:8px 12px;
  margin:0 12px 8px 12px;

  background:#fdeeee;

  border:1px solid #f3c6c9;
  border-left:3px solid #dc3545;

  border-radius:10px;

  font-size:13px;

  color:#a71d2a;

  font-weight:600;
}

.chat-recording.show{
  display:flex;
}

.chat-recording-stop{
  margin-left:auto;

  background:#dc3545;
  color:white;

  border:none;
  border-radius:8px;

  padding:5px 14px;

  font-weight:bold;

  cursor:pointer;
}

.chat-recording-stop:hover{
  background:#a71d2a;
}

/* =========================
   LOADING
========================= */

.loading{
  text-align:center;
  padding:30px;
  color:#165d3c;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:30px 20px;
  color:#777;
}

.empty h3{
  color:#165d3c;
  margin-bottom:7px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  html,
  body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
    overflow-y:auto;
  }

  body{
    position:relative;
  }

  header{
    height:auto;

    padding:10px 12px;

    gap:8px;
  }

  .logo{
    font-size:18px;
  }

  .logo small{
    font-size:10px;
  }

  .header-actions{
    gap:5px;
  }

  .header-actions .btn{
    padding:8px 10px;
    font-size:12px;
  }

  .container{
    width:100%;

    min-height:calc(100dvh - 86px);

    height:auto;

    padding:8px;
  }

  .messaging{
    width:100%;

    min-height:calc(100dvh - 102px);

    height:auto;

    border-radius:10px;

    grid-template-columns:1fr;

    overflow:hidden;
  }

  .inbox{
    width:100%;
    height:calc(100dvh - 102px);

    min-height:0;

    border-right:none;
  }

  .inbox-header{
    padding:12px;
  }

  .inbox-header h2{
    font-size:18px;
    margin-bottom:9px;
  }

  .conversations{
    min-height:0;

    overflow-y:auto;
    overflow-x:hidden;

    -webkit-overflow-scrolling:touch;
  }

  .chat{
    width:100%;

    min-height:calc(100dvh - 102px);

    height:auto;

    display:none;

    overflow:hidden;
  }

  .messaging.chat-open .inbox{
    display:none;
  }

  .messaging.chat-open .chat{
    display:flex;
  }

  #chatContent{
    width:100%;

    min-height:calc(100dvh - 102px);

    height:auto !important;

    display:flex;

    flex-direction:column;

    overflow:hidden;
  }

  .chat-header{
    flex:0 0 auto;

    min-height:58px;

    padding:9px;
  }

  .back-btn{
    display:inline-block !important;

    flex:0 0 auto;
  }

  .chat-user{
    min-width:0;
    flex:1;
  }

  .chat-user h3{
    font-size:16px;
  }

  .messages{
    flex:1 1 auto;

    min-height:0;

    height:auto;

    padding:14px 9px;

    overflow-y:auto;
    overflow-x:hidden;

    -webkit-overflow-scrolling:touch;

    overscroll-behavior:contain;

    scroll-behavior:smooth;
  }

  .message-row{
    margin-bottom:9px;
  }

  .bubble{
    max-width:85%;

    padding:9px 11px;

    font-size:14px;
  }

  .chat-input{
    flex:0 0 auto;

    width:100%;

    padding:8px;

    gap:6px;

    padding-bottom:calc(
      8px + env(safe-area-inset-bottom)
    );
  }

  .chat-input textarea{
    min-width:0;

    height:44px;

    max-height:100px;

    padding:11px;

    font-size:14px;
  }

  .send-btn{
    flex:0 0 auto;

    min-height:44px;

    padding:0 14px;
  }

}

/* =========================
   VERY SMALL PHONES
========================= */

@media(max-width:380px){

  .header-actions .btn{
    padding:7px 8px;
    font-size:11px;
  }

  .container{
    min-height:calc(100dvh - 78px);

    padding:5px;
  }

  .messaging{
    min-height:calc(100dvh - 88px);
  }

  .inbox{
    height:calc(100dvh - 88px);
  }

  .chat{
    min-height:calc(100dvh - 88px);
  }

  #chatContent{
    min-height:calc(100dvh - 88px);
  }

  .bubble{
    max-width:88%;
  }

  .chat-input textarea{
    font-size:13px;
  }

  .send-btn{
    padding:0 11px;
    font-size:12px;
  }

}

/* =========================
   DESKTOP
========================= */

@media(min-width:701px){

  .back-btn{
    display:none !important;
  }

}

</style>


<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10462d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arewa Market">
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

  <div class="logo">

    Arewa Market

    <small>
      Messages
    </small>

  </div>

  <div class="header-actions">

    <a
      href="./index.html"
      class="btn btn-light"
    >
      Marketplace
    </a>

    <a
      href="./seller-dashboard.html"
      id="dashboardBtn"
      class="btn btn-gold"
      style="display:none;"
    >
      Seller Dashboard
    </a>

    <button
      id="logoutBtn"
      class="btn btn-danger"
      style="display:none;"
    >
      Logout
    </button>

  </div>

</header>

<!-- =========================
     MAIN
========================= -->

<div class="container">

  <div
    id="notice"
    class="notice"
  ></div>

  <div
    id="messaging"
    class="messaging"
  >

    <!-- =========================
         INBOX
    ========================= -->

    <aside class="inbox">

      <div class="inbox-header">

        <h2>
          💬 Messages
        </h2>

        <input
          type="text"
          id="conversationSearch"
          class="search"
          placeholder="Search conversations..."
        >

      </div>

      <div
        id="conversations"
        class="conversations"
      >

        <div class="loading">
          Loading messages...
        </div>

      </div>

    </aside>

    <!-- =========================
         CHAT
    ========================= -->

    <section class="chat">

      <div
        id="chatEmpty"
        class="chat-empty"
      >

        <div>

          <h3>
            Select a conversation
          </h3>

          <p>
            Choose a seller or buyer from
            your messages to start chatting.
          </p>

        </div>

      </div>

      <div
        id="chatContent"
        style="display:none; height:100%; flex-direction:column;"
      >

        <!-- CHAT HEADER -->

        <div class="chat-header">

          <button
            id="backBtn"
            class="btn btn-light back-btn"
            type="button"
          >
            ←
          </button>

          <div
            id="chatAvatar"
            class="avatar"
          >
            ?
          </div>

          <div class="chat-user">

            <h3 id="chatName">
              User
            </h3>

            <p id="chatRole">
              Arewa Market
            </p>

          </div>

        </div>

        <!-- MESSAGES -->

        <div
          id="messages"
          class="messages"
        >
        </div>

        <!-- INPUT -->

        <!-- IMAGE PREVIEW (before sending) -->

        <div
          id="chatImagePreviewBox"
          class="chat-media-preview"
        >

          <img
            id="chatImagePreview"
            alt="Selected photo"
          >

          <span
            id="chatImageStatus"
            class="chat-media-status"
          ></span>

          <button
            type="button"
            id="chatImageRemoveBtn"
            class="chat-media-remove"
          >
            ✕
          </button>

        </div>

        <!-- VIDEO PREVIEW (before sending) -->

        <div
          id="chatVideoPreviewBox"
          class="chat-media-preview"
        >

          <video
            id="chatVideoPreview"
            muted
          ></video>

          <span
            id="chatVideoStatus"
            class="chat-media-status"
          ></span>

          <button
            type="button"
            id="chatVideoRemoveBtn"
            class="chat-media-remove"
          >
            ✕
          </button>

        </div>

        <!-- VOICE NOTE PREVIEW (before sending) -->

        <div
          id="chatAudioPreviewBox"
          class="chat-media-preview"
        >

          <audio
            id="chatAudioPreview"
            controls
          ></audio>

          <span
            id="chatAudioStatus"
            class="chat-media-status"
          ></span>

          <button
            type="button"
            id="chatAudioRemoveBtn"
            class="chat-media-remove"
          >
            ✕
          </button>

        </div>

        <!-- RECORDING INDICATOR -->

        <div
          id="chatRecordingBox"
          class="chat-recording"
        >
          🔴 Recording... <span id="chatRecordingTimer">0:00</span>
          <button
            type="button"
            id="chatRecordingStopBtn"
            class="chat-recording-stop"
          >
            Stop
          </button>
        </div>

        <form
          id="messageForm"
          class="chat-input"
        >

          <button
            type="button"
            id="chatAttachBtn"
            title="Attach photo"
            class="chat-media-btn"
          >
            📷
          </button>

          <input
            type="file"
            id="chatImageFile"
            accept="image/*"
            style="display:none;"
          >

          <button
            type="button"
            id="chatVideoAttachBtn"
            title="Attach video"
            class="chat-media-btn"
          >
            🎥
          </button>

          <input
            type="file"
            id="chatVideoFile"
            accept="video/*"
            style="display:none;"
          >

          <button
            type="button"
            id="chatMicBtn"
            title="Record voice note"
            class="chat-media-btn"
          >
            🎤
          </button>

          <textarea
            id="messageInput"
            placeholder="Type a message..."
            maxlength="2000"
          ></textarea>

const sendBtn =

  );

/* =========================================
   STATE
========================================= */

let currentUser = null;

let currentUserData = null;

let currentConversationId = null;

let currentOtherUserId = null;

let conversations = [];

let unsubscribeConversations = null;

let unsubscribeMessages = null;

/* =========================================
   URL
========================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const requestedSellerId =
  params.get("sellerId");

/* =========================================
   NOTICE
========================================= */

function showNotice(
  text,
  type = "error"
){

  notice.textContent =
    text;

  notice.className =
    "notice " + type;

  setTimeout(() => {

    notice.className =
      "notice";

  },4000);

}

/* =========================================
   AUTH
========================================= */

onAuthStateChanged(
  auth,
  async (user) => {

    currentUser = user;

    if(!user){

      window.location.href =
        "login.html?returnUrl=" +
        encodeURIComponent(
          window.location.href
        );

      return;

    }

    logoutBtn.style.display =
      "inline-block";

    try{

      const userSnap =
        await getDoc(
          doc(
            db,
            "users",
            user.uid
          )
        );

      if(userSnap.exists()){

        currentUserData =
          userSnap.data();

        if(
          currentUserData.role === "seller" &&
          currentUserData.isSeller === true &&
          currentUserData.sellerStatus === "approved"
        ){

          dashboardBtn.style.display =
            "inline-block";

        }

      }

      startConversations();

    }catch(error){

      console.error(
        "User error:",
        error
      );

      showNotice(
        "Unable to load your account."
      );

    }

  }
);

/* =========================================
   START CONVERSATIONS
========================================= */

function startConversations(){

  if(unsubscribeConversations){

    unsubscribeConversations();

  }

  const conversationsRef =
    collection(
      db,
      "conversations"
    );

  const q =
  query(
    conversationsRef,
    where(
      "participantIds",
      "array-contains",
      currentUser.uid
    ),
    orderBy(
      "lastMessageAt",
      "desc"
    )
  );

  unsubscribeConversations =
    onSnapshot(
      q,
      async (snapshot) => {

        conversations = [];

        for(
          const conversationDoc
          of snapshot.docs
        ){

          const data =
            conversationDoc.data();

          const otherUserId =
            data.participantIds &&
            data.participantIds.find(
              id =>
                id !== currentUser.uid
            );

          if(!otherUserId){

            continue;

          }

          let otherUser = null;

          try{

            const userSnap =
              await getDoc(
                doc(
                  db,
                  "users",
                  otherUserId
                )
              );

            if(userSnap.exists()){

              otherUser = {

                id:
                  otherUserId,

                ...userSnap.data()

              };

            }

          }catch(error){

            console.error(
              "Other user error:",
              error
            );

          }

          conversations.push({

            id:
              conversationDoc.id,

            ...data,

            otherUser

          });

        }

        renderConversations();

        /*
          If sellerId was passed from
          seller-profile.html, automatically
          open that seller's conversation.
        */

        if(
          requestedSellerId &&
          !currentConversationId
        ){

          await openOrCreateConversation(
            requestedSellerId
          );

        }

      },
      (error) => {

        console.error(
          "Conversation listener error:",
          error
        );

        showNotice(
          "Unable to load messages: " +
          error.message
        );

      }
    );

}

/* =========================================
   RENDER CONVERSATIONS
========================================= */

function renderConversations(){

  const search =
    conversationSearch.value
      .trim()
      .toLowerCase();

  let list =
    conversations.filter(
      conversation => {

        if(!search){

          return true;

        }

        const user =
          conversation.otherUser || {};

        const name =
          String(
            user.name ||
            user.businessName ||
            ""
          ).toLowerCase();

        const lastMessage =
          String(
            conversation.lastMessage ||
            ""
          ).toLowerCase();

        return (
          name.includes(search) ||
          lastMessage.includes(search)
        );

      }
    );

  if(!list.length){

    conversationsContainer.innerHTML = `

      <div class="empty">

        <h3>
          No messages yet
        </h3>

        <p>
          Start a conversation with a seller.
        </p>

      </div>

    `;

    return;

  }

  conversationsContainer.innerHTML =
    list.map(
      conversationItem
    ).join("");

  document
    .querySelectorAll(
      ".conversation"
    )
    .forEach(item => {

      item.addEventListener(
        "click",
        () => {

          openConversation(
            item.dataset.id
          );

        }
      );

    });

}

/* =========================================
   CONVERSATION ITEM
========================================= */

function conversationItem(
  conversation
){

  const user =
    conversation.otherUser || {};

  const name =
    user.businessName ||
    user.name ||
    "Arewa Market User";

  const initial =
    name
      .charAt(0)
      .toUpperCase();

  const unread =
    Number(
      conversation.unreadCount &&
      conversation.unreadCount[currentUser.uid]
        ? conversation.unreadCount[currentUser.uid]
        : 0
    );

  const active =
    conversation.id ===
    currentConversationId
      ? "active"
      : "";

  return `

    <div
      class="conversation ${active}"
      data-id="${escapeHtml(conversation.id)}"
    >

      <div class="avatar">

        ${
          user.profileImageUrl
          ?
          `
          <img
            src="${escapeHtml(
              user.profileImageUrl
            )}"
            alt="${escapeHtml(name)}"
            onerror="
              this.style.display='none'
            "
          >
          `
          :
          escapeHtml(initial)
        }

      </div>

      <div class="conversation-info">

        <div class="conversation-top">

          <div class="conversation-name">

            ${escapeHtml(name)}

            ${
              unread > 0
              ?
              `
              <span class="unread">
                ${unread > 99 ? "99+" : unread}
              </span>
              `
              :
              ""
            }

          </div>

          <div class="conversation-time">

            ${formatTime(
              conversation.lastMessageAt
            )}

          </div>

        </div>

        <div class="last-message">

          ${escapeHtml(
            conversation.lastMessage ||
            "No messages yet"
          )}

        </div>

      </div>

    </div>

  `;

}

/* =========================================
   OPEN OR CREATE CONVERSATION
========================================= */

async function openOrCreateConversation(
  otherUserId
){

  if(!currentUser){

    return;

  }

  if(
    otherUserId === currentUser.uid
  ){

    showNotice(
      "You cannot message yourself."
    );

    return;

  }

  try{

    /*
      Find existing conversation
      between the two users.
    */

    let existing =
      conversations.find(
        conversation => {

          return (
            conversation.participantIds &&
            conversation.participantIds.includes(
              otherUserId
            )
          );

        }
      );

    if(existing){

      openConversation(
        existing.id
      );

      return;

    }

    /*
      Load other user.
    */

    const userSnap =
      await getDoc(
        doc(
          db,
          "users",
          otherUserId
        )
      );

    if(!userSnap.exists()){

      showNotice(
        "Seller profile not found."
      );

      return;

    }

    const otherUser =
      userSnap.data();

    if(
      otherUser.role === "seller" &&
      (
        otherUser.isSeller !== true ||
        otherUser.sellerStatus !== "approved"
      )
    ){

      showNotice(
        "This seller is not available."
      );

      return;

    }

    /*
      Create conversation.
    */

    const conversationRef =
      await addDoc(
        collection(
          db,
          "conversations"
        ),
        {

          participantIds:[
            currentUser.uid,
            otherUserId
          ],

          participants:[
            currentUser.uid,
            otherUserId
          ],

          lastMessage:"",
          lastMessageAt:
            serverTimestamp(),

          unreadCount:{
            [currentUser.uid]:0,
            [otherUserId]:0
          },

          createdAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp()

        }
      );

    currentConversationId =
      conversationRef.id;

    currentOtherUserId =
      otherUserId;

    await displayChatUser(
      otherUserId
    );

    subscribeToMessages(
      conversationRef.id
    );

  }catch(error){

    console.error(
      "Create conversation error:",
      error
    );

    showNotice(
      "Unable to start conversation: " +
      error.message
    );

  }

}

/* =========================================
   OPEN CONVERSATION
========================================= */

async function openConversation(
  conversationId
){

  const conversation =
    conversations.find(
      item =>
        item.id === conversationId
    );

  if(!conversation){

    return;

  }

  currentConversationId =
    conversationId;

  currentOtherUserId =
    conversation.otherUser &&
    conversation.otherUser.id;

  renderConversations();

  await displayChatUser(
    currentOtherUserId
  );

  subscribeToMessages(
    conversationId
  );

  /*
    Reset unread count for current user.
  */

  if(
    conversation.unreadCount &&
    Number(
      conversation.unreadCount[currentUser.uid] || 0
    ) > 0
  ){

    try{

      await updateDoc(
        doc(
          db,
          "conversations",
          conversationId
        ),
        {

          [`unreadCount.${currentUser.uid}`]:
            0,

          updatedAt:
            serverTimestamp()

        }
      );

    }catch(error){

      console.error(
        "Unread update error:",
        error
      );

    }

  }

  if(
    window.innerWidth <= 700
  ){

    messaging.classList.add(
      "chat-open"
    );

  }

}

/* =========================================
   DISPLAY CHAT USER
========================================= */

async function displayChatUser(
  userId
){

  if(!userId){

    return;

  }

  try{

    const userSnap =
      await getDoc(
        doc(
          db,
          "users",
          userId
        )
      );

    if(!userSnap.exists()){

      return;

    }

    const user =
      userSnap.data();

    const name =
      user.businessName ||
      user.name ||
      "Arewa Market User";

    const initial =
      name
        .charAt(0)
        .toUpperCase();

    chatName.textContent =
      name;

    chatRole.textContent =
      user.role === "seller"
        ? "Seller"
        : "Buyer";

    if(user.profileImageUrl){

      chatAvatar.innerHTML = `

        <img
          src="${escapeHtml(
            user.profileImageUrl
          )}"
          alt="${escapeHtml(name)}"
          onerror="
            this.style.display='none'
          "
        >

      `;

    }else{

      chatAvatar.textContent =
        initial;

    }

    chatEmpty.style.display =
      "none";

    chatContent.style.display =
      "flex";

  }catch(error){

    console.error(
      "Display user error:",
      error
    );

  }

}

/* =========================================
   SUBSCRIBE MESSAGES
========================================= */

function subscribeToMessages(
  conversationId
){

  if(unsubscribeMessages){

    unsubscribeMessages();

  }

  messagesContainer.innerHTML = `

    <div class="loading">
      Loading messages...
    </div>

  `;

  const messagesRef =
    collection(
      db,
      "conversations",
      conversationId,
      "messages"
    );

  const q =
    query(
      messagesRef,
      orderBy(
        "createdAt",
        "asc"
      )
    );

  unsubscribeMessages =
    onSnapshot(
      q,
      (snapshot) => {

        messagesContainer.innerHTML =
          "";

        if(snapshot.empty){

          messagesContainer.innerHTML = `

            <div class="empty">

              <h3>
                Start the conversation
              </h3>

              <p>
                Send your first message below.
              </p>

            </div>

          `;

          return;

        }

        snapshot.forEach(
          messageDoc => {

            renderMessage(
              messageDoc.data(),
              messageDoc.id
            );

          }
        );

        requestAnimationFrame(() => {

          messagesContainer.scrollTop =
            messagesContainer.scrollHeight;

        });

      },
      (error) => {

        console.error(
          "Messages listener error:",
          error
        );

        messagesContainer.innerHTML = `

          <div class="empty">

            Unable to load messages.

          </div>

        `;

      }
    );

}

/* =========================================
   DELETE MESSAGE
========================================= */

function closeAllMessageMenus(){

  document
    .querySelectorAll(
      ".msg-options-menu.show"
    )
    .forEach(
      (menu) => {
        menu.classList.remove(
          "show"
        );
      }
    );

}

document.addEventListener(
  "click",
  closeAllMessageMenus
);

async function deleteMessageForMe(
  messageId
){

  if(
    !currentConversationId ||
    !messageId
  ){
    return;
  }

  try{

    const messageRef =
      doc(
        db,
        "conversations",
        currentConversationId,
        "messages",
        messageId
      );

    await updateDoc(
      messageRef,
      {
        deletedFor:
          arrayUnion(
            currentUser.uid
          )
      }
    );

  }catch(error){

    console.error(
      "Delete for me error:",
      error
    );

    alert(
      "Unable to delete message. Please try again."
    );

  }

}

async function deleteMessageForEveryone(
  messageId
){

  if(
    !currentConversationId ||
    !messageId
  ){
    return;
  }

  try{

    const messageRef =
      doc(
        db,
        "conversations",
        currentConversationId,
        "messages",
        messageId
      );

    await updateDoc(
      messageRef,
      {
        deleted:true,
        text:"",
        imageUrl:null,
        videoUrl:null,
        audioUrl:null
      }
    );

  }catch(error){

    console.error(
      "Delete for everyone error:",
      error
    );

    alert(
      "Unable to delete message. Please try again."
    );

  }

}

/* =========================================
   RENDER MESSAGE
========================================= */

function renderMessage(
  message,
  messageId
){

  // "Delete for me": kada a nuna wa wanda ya boye shi
  if(
    Array.isArray(message.deletedFor) &&
    message.deletedFor.includes(currentUser.uid)
  ){
    return;
  }

  const mine =
    message.senderId ===
    currentUser.uid;

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "message-row " +
    (
      mine
        ? "mine"
        : "theirs"
    );

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";

  bubble.style.position =
    "relative";

  // "Delete for everyone": nuna sako a matsayin da aka goge
  if(message.deleted === true){

    const deletedText =
      document.createElement(
        "div"
      );

    deletedText.className =
      "deleted-message";

    deletedText.textContent =
      "🚫 This message was deleted";

    bubble.appendChild(
      deletedText
    );

    const time =
      document.createElement(
        "span"
      );

    time.className =
      "message-time";

    time.textContent =
      formatTime(
        message.createdAt
      );

    bubble.appendChild(
      time
    );

    row.appendChild(
      bubble
    );

    messagesContainer.appendChild(
      row
    );

    return;

  }

  const optionsBtn =
    document.createElement(
      "button"
    );

  optionsBtn.type =
    "button";

  optionsBtn.className =
    "msg-options-btn";

  optionsBtn.textContent =
    "⋮";

  optionsBtn.title =
    "Message options";

  const optionsMenu =
    document.createElement(
      "div"
    );

  optionsMenu.className =
    "msg-options-menu";

  const deleteForMeBtn =
    document.createElement(
      "button"
    );

  deleteForMeBtn.type =
    "button";

  deleteForMeBtn.textContent =
    "Delete for me";

  deleteForMeBtn.addEventListener(
    "click",
    async (e) => {

      e.stopPropagation();

      optionsMenu.classList.remove(
        "show"
      );

      if(
        !confirm(
          "Delete this message for you only?"
        )
      ){
        return;
      }

      await deleteMessageForMe(
        messageId
      );

    }
  );

  optionsMenu.appendChild(
    deleteForMeBtn
  );

  if(mine){

    const deleteForEveryoneBtn =
      document.createElement(
        "button"
      );

    deleteForEveryoneBtn.type =
      "button";

    deleteForEveryoneBtn.className =
      "danger";

    deleteForEveryoneBtn.textContent =
      "Delete for everyone";

    deleteForEveryoneBtn.addEventListener(
      "click",
      async (e) => {

        e.stopPropagation();

        optionsMenu.classList.remove(
          "show"
        );

        if(
          !confirm(
            "Delete this message for everyone in this chat?"
          )
        ){
          return;
        }

        await deleteMessageForEveryone(
          messageId
        );

      }
    );

    optionsMenu.appendChild(
      deleteForEveryoneBtn
    );

  }

  optionsBtn.addEventListener(
    "click",
    (e) => {

      e.stopPropagation();

      const isOpen =
        optionsMenu.classList.contains(
          "show"
        );

      closeAllMessageMenus();

      if(!isOpen){

        optionsMenu.classList.add(
          "show"
        );

      }

    }
  );

  bubble.appendChild(
    optionsBtn
  );

  bubble.appendChild(
    optionsMenu
  );

  if(message.imageUrl){

    const image =
      document.createElement(
        "img"
      );

    image.src =
      message.imageUrl;

    image.alt =
      "Photo";

    image.style.maxWidth =
      "220px";

    image.style.borderRadius =
      "10px";

    image.style.display =
      "block";

    image.style.marginBottom =
      message.text
        ? "6px"
        : "0";

    image.style.cursor =
      "pointer";

    image.addEventListener(
      "click",
      () => {
        window.open(
          message.imageUrl,
          "_blank"
        );
      }
    );

    bubble.appendChild(
      image
    );

  }

  if(message.videoUrl){

    const video =
      document.createElement(
        "video"
      );

    video.src =
      message.videoUrl;

    video.controls =
      true;

    video.style.maxWidth =
      "240px";

    video.style.borderRadius =
      "10px";

    video.style.display =
      "block";

    video.style.marginBottom =
      message.text
        ? "6px"
        : "0";

    bubble.appendChild(
      video
    );

  }

  if(message.audioUrl){

    const audio =
      document.createElement(
        "audio"
      );

    audio.src =
      message.audioUrl;

    audio.controls =
      true;

    audio.style.maxWidth =
      "220px";

    audio.style.display =
      "block";

    audio.style.marginBottom =
      message.text
        ? "6px"
        : "0";

    bubble.appendChild(
      audio
    );

  }

  const text =
    document.createElement(
      "div"
    );

  text.textContent =
    message.text || "";

  const time =
    document.createElement(
      "span"
    );

  time.className =
    "message-time";

  time.textContent =
    formatTime(
      message.createdAt
    );

  if(message.text){

    bubble.appendChild(
      text
    );

  }

  bubble.appendChild(
    time
  );

  row.appendChild(
    bubble
  );

  messagesContainer.appendChild(
    row
  );

}

/* =========================================
   VOICE NOTE RECORDING (Cloudinary)
========================================= */

chatMicBtn.addEventListener(
  "click",
  async () => {

    if(mediaRecorder && mediaRecorder.state === "recording"){
      return;
    }

    if(
      !window.isSecureContext
    ){

      showNotice(
        "Voice recording only works on HTTPS (or localhost). This page is loaded over an insecure connection."
      );

      return;

    }

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      showNotice(
        "This browser/preview does not support microphone recording."
      );

      return;

    }

    let stream;

    try{

      stream =
        await navigator.mediaDevices.getUserMedia(
          { audio:true }
        );

    }catch(error){

      console.error(
        "Microphone permission error:",
        error.name,
        error.message
      );

      let msg =
        "Microphone access is required to record a voice note.";

      if(error.name === "NotAllowedError"){

        msg =
          "Microphone permission was blocked. Please allow microphone access for this site in your browser settings and try again.";

      }else if(error.name === "NotFoundError"){

        msg =
          "No microphone was found on this device.";

      }else if(error.name === "NotReadableError"){

        msg =
          "Another app is currently using the microphone.";

      }

      showNotice(
        msg
      );

      return;

    }

    clearAllPendingMedia();

    recordedChunks = [];

    mediaRecorder =
      new MediaRecorder(stream);

    mediaRecorder.addEventListener(
      "dataavailable",
      (e) => {
        if(e.data && e.data.size > 0){
          recordedChunks.push(e.data);
        }
      }
    );

    mediaRecorder.addEventListener(
      "stop",
      async () => {

        stream.getTracks().forEach(
          (track) => track.stop()
        );

        clearInterval(
          recordingIntervalId
        );

        chatRecordingBox.classList.remove(
          "show"
        );

        chatMicBtn.classList.remove(
          "recording"
        );

        const blob =
          new Blob(
            recordedChunks,
            { type:"audio/webm" }
          );

        if(blob.size === 0){
          return;
        }

        chatAudioPreviewBox.classList.add(
          "show"
        );

        chatAudioPreview.src =
          URL.createObjectURL(blob);

        chatAudioStatus.textContent =
          "⏳ Uploading...";

        try{

          const file =
            new File(
              [blob],
              "voice-note.webm",
              { type:"audio/webm" }
            );

          const result =
            await uploadToCloudinary(file);

          pendingAudioUrl =
            result.url;

          chatAudioStatus.textContent =
            "✅ Ready to send";

        }catch(error){

          console.error(
            "Voice note upload error:",
            error
          );

          chatAudioStatus.textContent =
            "❌ " + error.message;

          pendingAudioUrl =
            null;

        }

      }
    );

    mediaRecorder.start();

    recordingSeconds = 0;

    chatRecordingTimer.textContent =
      "0:00";

    chatRecordingBox.classList.add(
      "show"
    );

    chatMicBtn.classList.add(
      "recording"
    );

    recordingIntervalId =
      setInterval(
        () => {

          recordingSeconds++;

          const mins =
            Math.floor(recordingSeconds / 60);

          const secs =
            recordingSeconds % 60;

          chatRecordingTimer.textContent =
            mins + ":" +
            (secs < 10 ? "0" : "") + secs;

        },
        1000
      );

  }
);

chatRecordingStopBtn.addEventListener(
  "click",
  () => {

    if(mediaRecorder && mediaRecorder.state === "recording"){
      mediaRecorder.stop();
    }

  }
);

/* =========================================
   SEND MESSAGE
========================================= */

messageForm.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();

    const text =
      messageInput.value.trim();

    const imageUrl =
      pendingImageUrl;

    const videoUrl =
      pendingVideoUrl;

    const audioUrl =
      pendingAudioUrl;

    if(!text && !imageUrl && !videoUrl && !audioUrl){

      return;

    }

    if(
      !currentUser ||
      !currentConversationId ||
      !currentOtherUserId
    ){

      showNotice(
        "Please select a conversation."
      );

      return;

    }

    sendBtn.disabled =
      true;

    try{

      const messagesRef =
        collection(
          db,
          "conversations",
          currentConversationId,
          "messages"
        );

      await addDoc(
        messagesRef,
        {

          senderId:
            currentUser.uid,

          receiverId:
            currentOtherUserId,

          text:
            text,

          imageUrl:
            imageUrl || null,

          videoUrl:
            videoUrl || null,

          audioUrl:
            audioUrl || null,

          createdAt:
            serverTimestamp(),

          read:false

        }
      );

      const lastMessagePreview =
        text ||
        (
          imageUrl
            ? "📷 Photo"
            : videoUrl
              ? "🎥 Video"
              : audioUrl
                ? "🎤 Voice message"
                : ""
        );

      const conversationRef =
        doc(
          db,
          "conversations",
          currentConversationId
        );

      const conversationSnap =
        await getDoc(
          conversationRef
        );

      let currentUnread = 0;

      if(conversationSnap.exists()){

        const data =
          conversationSnap.data();

        currentUnread =
          Number(
            data.unreadCount &&
            data.unreadCount[
              currentOtherUserId
            ]
              ? data.unreadCount[
                  currentOtherUserId
                ]
              : 0
          );

      }

      await updateDoc(
        conversationRef,
        {

          lastMessage:
            lastMessagePreview,

          lastMessageAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp(),

          [`unreadCount.${currentUser.uid}`]:
            0,

          [`unreadCount.${currentOtherUserId}`]:
            currentUnread + 1

        }
      );

      messageInput.value =
        "";

      clearAllPendingMedia();

    }catch(error){

      console.error(
        "Send message error:",
        error
      );

      showNotice(
        "Message could not be sent: " +
        error.message
      );

    }

    sendBtn.disabled =
      false;

    messageInput.focus();

  }
);

/* =========================================
   FORMAT TIME
========================================= */

function formatTime(
  timestamp
){

  if(
    !timestamp ||
    !timestamp.toDate
  ){

    return "";

  }

  const date =
    timestamp.toDate();

  const now =
    new Date();

  const sameDay =
    date.toDateString() ===
    now.toDateString();

  if(sameDay){

    return date.toLocaleTimeString(
      "en-NG",
      {
        hour:"numeric",
        minute:"2-digit"
      }
    );

  }

  return date.toLocaleDateString(
    "en-NG",
    {
      day:"numeric",
      month:"short"
    }
  );

}

/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}

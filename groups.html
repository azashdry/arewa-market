<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Arewa Market - Groups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--g1:#0d3b2c;--g2:#175e3f;--gold:#c9a227;--bg:#f8f6f3;--ink:#222;--mu:#6b7a72;--ln:#e5e0d8;--red:#b3261e}
html,body{height:100%}
body{font-family:'Inter',Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh;max-width:680px;margin:0 auto}
header{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold)}
header h1{font-family:'Playfair Display',Georgia,serif;font-size:19px;line-height:1.2}
header small{display:block;font-size:12px;opacity:.8;margin-top:2px}
.hb{flex:1;min-width:0}
.ib{background:rgba(255,255,255,.15);border:0;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#app{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto}
.tabs,.st{display:flex;background:#fff;border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:2}
.tabs button,.st button{flex:1;padding:12px 4px;border:0;background:none;font:600 14px Inter,sans-serif;color:var(--mu);border-bottom:3px solid transparent;cursor:pointer}

h5{padding:14px 14px 6px;font-size:13px;color:var(--mu);font-weight:600}
.r{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-bottom:1px solid var(--ln);cursor:pointer}
.av{width:44px;height:44px;border-radius:50%;background:var(--g2);color:var(--gold);font:700 18px 'Playfair Display',serif;display:flex;align-items:center;justify-content:center;flex:none}
.rt{flex:1;min-width:0}.rt b{display:block;font-size:15px}.rt span{display:block;font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm{border:1px solid var(--g2);background:#fff;color:var(--g2);border-radius:16px;padding:6px 12px;font:600 12px Inter,sans-serif;cursor:pointer}
.sm.gold{background:var(--g2);color:#fff}.sm.red{border-color:var(--red);color:var(--red);margin-left:6px}

.btn.ghost{background:#fff;color:var(--g2);border:1px solid var(--g2)}.btn.red{background:#fff;color:var(--red);border:1px solid var(--red)}
.empty{padding:40px 24px;text-align:center;color:var(--mu);font-size:14px;line-height:1.5}
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.b{max-width:80%;align-self:flex-start;background:#fff;border-radius:12px 12px 12px 3px;padding:8px 11px;font-size:14px;white-space:pre-wrap;word-break:break-word;border:1px solid var(--ln)}
.b.me{align-self:flex-end;background:#dcefe3;border-radius:12px 12px 3px 12px;border-color:#c6e0cf}
.b b{display:block;font-size:12px;color:var(--g2);margin-bottom:2px}.b i,.up i{display:block;font-size:11px;color:var(--mu);font-style:normal;margin-top:3px;text-align:right}
.cmp{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--ln)}
.cmp input{flex:1;border:1px solid var(--ln);border-radius:20px;padding:10px 14px;font:14px Inter,sans-serif;outline-color:var(--g2)}
.cmp button{border:0;background:var(--gold);color:#fff;border-radius:20px;padding:0 18px;font:600 14px Inter,sans-serif;cursor:pointer}
.note{width:100%;text-align:center;font-size:13px;color:var(--mu);padding:4px}
.card2,.post{background:#fff;padding:14px;border-bottom:1px solid var(--ln);font-size:14px;line-height:1.5}
.rowb{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}.mu{color:var(--mu);font-size:13px}
textarea,#fn,#fd{width:100%;border:1px solid var(--ln);border-radius:10px;padding:10px;font:14px Inter,sans-serif;outline-color:var(--g2);resize:vertical}

.up em,.mrow em{font-size:11px;color:var(--mu)}.up a{color:var(--g2);cursor:pointer;margin-left:8px;font-weight:600}
.rx{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.rx button{border:1px solid var(--ln);background:#fff;border-radius:14px;padding:3px 9px;font-size:13px;cursor:pointer}.rx button.on{border-color:var(--g2);background:#e8f4ec}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}.sh.on{display:flex}
.sh .card{background:#fff;width:100%;max-width:680px;max-height:85dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.card h3{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:6px}.card h4{margin:16px 0 6px;font-size:14px;color:var(--mu)}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln);font-size:14px;gap:8px}
.lbl{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%;text-align:center}#toast.on{opacity:1}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:84px;height:84px;font-size:34px;margin:0 auto 10px}.av.s2{width:32px;height:32px;font-size:14px}
.mi{display:block;max-width:100%;max-height:300px;border-radius:8px;margin:2px 0 4px;background:#000}
.ma{display:block;width:240px;max-width:100%;margin:2px 0 4px}
.fl{display:flex;gap:8px;align-items:center;text-decoration:none;color:inherit;background:rgba(0,0,0,.06);padding:8px 10px;border-radius:8px;margin:2px 0 4px}
.fl .fi{min-width:0;display:flex;flex-direction:column}.fl .fn{font-weight:600;font-size:13px;word-break:break-all}.fl .fs{font-size:11px;color:var(--mu)}
.cmp .ic{background:#fff;border:1px solid var(--ln);color:var(--ink);padding:0;width:40px;height:40px;border-radius:50%;font-size:18px;flex:none}
.cmp .ic.rec,.ic.rec{background:var(--red);color:#fff;border-color:var(--red)}
.tools{display:flex;gap:8px;align-items:center;margin-top:8px}.tools .ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--ln);background:#fff;font-size:17px;cursor:pointer}.tools .mu a{color:var(--red);margin-left:6px;cursor:pointer}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;margin-top:14px}
.sb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink);text-decoration:none;cursor:pointer}
.sb span{width:48px;height:48px;border-radius:50%;background:#e8f4ec;display:flex;align-items:center;justify-content:center;font-size:22px}
html{background:#ebe7df}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.i.f{fill:currentColor;stroke:none}
.cmp .ic,.tools .ic{display:flex;align-items:center;justify-content:center}.cmp .ic.rb{background:var(--g2);color:#fff;border-color:var(--g2)}
.b{position:relative}.mm{position:absolute;top:2px;right:4px;border:0;background:none;color:var(--mu);width:22px;height:22px;padding:0;opacity:.55;cursor:pointer;display:flex;align-items:center;justify-content:center}.b:hover .mm{opacity:1}.mm .i{width:16px;height:16px}
.fw{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mu);font-style:italic;margin-bottom:2px}.fw .i{width:13px;height:13px}
.vn{display:flex;align-items:center;gap:8px;min-width:210px;margin:2px 0 4px}.vn button{width:34px;height:34px;border-radius:50%;border:0;background:var(--g2);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}.vn .vp{flex:1;min-width:80px;accent-color:var(--g2)}.vn .vt{font-size:12px;color:var(--mu);min-width:34px;text-align:right}
.vo{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--g2);background:#fff;color:var(--g2);border-radius:18px;padding:6px 12px;font:600 13px Inter,sans-serif;cursor:pointer;margin:2px 0 4px}.vo.off{border-color:var(--ln);color:var(--mu);cursor:default}.vo .i{width:18px;height:18px}
.mn{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--ln);font-size:15px;cursor:pointer}.mn:hover{background:#faf8f4}.mn.red{color:var(--red)}
.eb{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#eef6f1;border-top:1px solid var(--ln);font-size:13px;color:var(--g2)}.eb:empty{display:none}.eb button{margin-left:auto;border:0;background:none;color:var(--g2);cursor:pointer;display:flex}
.shb{background:#eef2ee;color:var(--g1);width:34px;height:34px;margin:-4px 0 8px}
.vw{position:fixed;inset:0;background:#000;z-index:15;display:none;flex-direction:column}.vw.on{display:flex}.vh{padding:calc(10px + env(safe-area-inset-top)) 12px 10px}.vb{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}.vb img,.vb video{max-width:100%;max-height:100%;object-fit:contain}.vb audio{width:min(420px,92%)}
.recbar{display:none;align-items:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--ln)}body.recording .recbar{display:flex}body.recording .cmp{display:none}
.recbar .ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}.recbar .ic.snd{background:var(--g2);color:#fff;border-color:var(--g2)}.recbar .ic.on{background:#25d366;border-color:#25d366;color:#fff}
.recbar .rd{width:10px;height:10px;border-radius:50%;background:var(--red);animation:bl 1s infinite}@keyframes bl{50%{opacity:.25}}.recbar .rt2{font-variant-numeric:tabular-nums;font-size:15px}.recbar .sp{flex:1}
@media(min-width:760px){body{max-width:860px;box-shadow:0 0 0 1px var(--ln),0 12px 40px rgba(0,0,0,.08)}header{padding-left:20px;padding-right:20px}.b{max-width:68%}.sh{align-items:center}.sh .card{max-width:460px;border-radius:18px}.r:hover,.mrow:hover{background:#faf8f4}.ib:hover{background:rgba(255,255,255,.28)}.sg{grid-template-columns:repeat(5,1fr)}.msgs{padding:16px 20px}.mm{opacity:0}.b:hover .mm{opacity:1}}
@media(min-width:1200px){body{max-width:980px}header h1{font-size:21px}.b{font-size:15px;max-width:62%}.up{font-size:15px}}
@media(max-width:360px){header h1{font-size:17px}.cmp{gap:6px;padding-left:8px;padding-right:8px}.cmp .ic{width:36px;height:36px}.sg{gap:10px 2px}.b{max-width:88%}}
@media(max-height:480px){.sh .card{max-height:94dvh}}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header>
  <button class="ib" id="back" data-act="back" style="display:none" aria-label="Back">&#8592;</button>
  <div class="hb"><h1 id="ttl">Groups</h1><small id="sub"></small></div>
  <div id="act"></div>
</header>
<div id="app"><div class="empty">Loading...</div></div>
<div class="recbar" id="recbar"></div>
<div class="vw" id="vw"></div>
<div class="sh" id="sh" data-act="shclose"></div>
<div id="toast"></div>
<input type="file" id="fp" hidden>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
  collection, doc, getDoc, getDocs, addDoc, setDoc, updateDoc, deleteDoc, deleteField,
  arrayUnion, arrayRemove, increment, onSnapshot, query, where, orderBy, limit,
  serverTimestamp, Timestamp, writeBatch
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import { uploadToCloudinary } from "./cloudinary-upload.js";

/* Iyakoki (limits) - kamar WhatsApp */
const LIM = { group: 1024, community: 5000, commGroups: 49, days: 30 };
const EM = ["👍", "❤️", "😂", "🙏"];

const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const link = (k, v) => `${location.origin}${location.pathname}?${k}=${encodeURIComponent(v)}`;
const fmt = t => t?.toDate ? t.toDate().toLocaleString([], { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" }) : "";
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.i); toast.i = setTimeout(() => t.classList.remove("on"), 2600); };

let me, myName = "", tab = "groups", cx = "groups";
let unsub = [], sub = [];
let G, CH, C, UPS = [], cg = [], foll = false, cmpMode = "", ctab = "a";
const cache = { groups: [], channels: [], communities: [], follows: new Set() };
const names = {}, photos = {};
let place = "", PEND = null, MSGS = {}, EDIT = null, FW = null, AU = null, AUid = null, AUdur = 0, rc = null;
const safe = u => /^https:\/\//i.test(u || "") ? esc(u) : "";
const bytes = n => !n ? "" : n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
const av = (o, cls = "") => `<div class="av ${cls}">${safe(o.photoURL) ? `<img src="${safe(o.photoURL)}" alt="">` : esc((o.name || "?")[0].toUpperCase())}</div>`;
const avU = (uid, cls = "s2") => `<div class="av ${cls}">${safe(photos[uid]) ? `<img src="${safe(photos[uid])}" alt="">` : esc((names[uid] || "?")[0].toUpperCase())}</div>`;
const IC = {
  back: '<path d="M19 12H5M12 19l-7-7 7-7"/>',
  mic: '<path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/>',
  send: '<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',
  clip: '<path d="M21 11l-9 9a5 5 0 0 1-7-7l9-9a3 3 0 0 1 4 4l-9 9a1 1 0 0 1-2-2l8-8"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  play: '<path d="M8 5v14l11-7z"/>',
  pause: '<path d="M7 5h3v14H7zM14 5h3v14h-3z"/>',
  fwd: '<path d="M15 4l6 6-6 6M21 10H9a6 6 0 0 0-6 6v3"/>',
  edit: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  copy: '<path d="M9 9h11v11H9zM5 15V4h11"/>',
  chev: '<path d="M6 9l6 6 6-6"/>',
  once: '<circle cx="12" cy="12" r="9"/><path d="M10.5 9.5L12.5 8v8"/>'
};
const icon = (n, c = "") => `<svg class="i ${c}" viewBox="0 0 24 24">${IC[n]}</svg>`;
const mmss = s => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function media(x, id = "") {
  if (x.viewOnce) {
    const k = x.imageUrl ? "Photo" : x.videoUrl ? "Video" : "Voice message", mine = x.senderId === me.uid, op = x.openedBy?.includes(me.uid), n = x.openedBy?.length || 0;
    const lb = mine ? "View once" + (n ? ` &middot; opened by ${n}` : "") : op ? "Opened" : "Tap to view";
    return `<button class="vo ${mine || op ? "off" : ""}" ${mine || op ? "disabled" : `data-act="vopen" data-id="${id}"`}>${icon("once")} ${k} &middot; ${lb}</button>`;
  }
  let m = "";
  if (safe(x.imageUrl)) m += `<img class="mi" data-act="zoom" data-u="${safe(x.imageUrl)}" src="${safe(x.imageUrl)}" loading="lazy" alt="Photo">`;
  if (safe(x.videoUrl)) m += `<video class="mi" src="${safe(x.videoUrl)}" controls preload="metadata" playsinline></video>`;
  if (safe(x.audioUrl)) m += `<div class="vn" data-vn="${id}"><button data-act="vplay" data-id="${id}" data-u="${safe(x.audioUrl)}" aria-label="Play">${icon("play", "f")}</button><input class="vp" type="range" min="0" max="100" value="0" data-id="${id}"><span class="vt" data-d="${x.duration || 0}">${mmss(x.duration)}</span></div>`;
  if (safe(x.fileUrl)) m += `<a class="fl" href="${safe(x.fileUrl)}" target="_blank" rel="noopener"><span>&#128196;</span><span class="fi"><span class="fn">${esc(x.fileName || "Document")}</span><span class="fs">${bytes(x.fileSize)}</span></span></a>`;
  return m;
}
const vnEl = id => document.querySelector(`[data-vn="${CSS.escape(String(id))}"]`);
function vnUpd(id) {
  const e = vnEl(id); if (!e) return;
  const t = e.querySelector(".vt"), p = e.querySelector(".vp"), b = e.querySelector("button");
  const live = AU && AUid === id, d = live ? AUdur : +t.dataset.d;
  b.innerHTML = icon(live && !AU.paused ? "pause" : "play", "f");
  p.value = live && d ? (AU.currentTime / d) * 100 : 0;
  t.textContent = mmss(live && AU.currentTime > 0 ? AU.currentTime : d);
}
function showViewer(html) { const v = $("#vw"); v.innerHTML = `<div class="vh"><button class="ib" data-act="vclose" aria-label="Back">${icon("back")}</button></div><div class="vb">${html}</div>`; v.classList.add("on"); }
function closeViewer() { const v = $("#vw"); v.classList.remove("on"); v.innerHTML = ""; }
const pickFile = accept => new Promise(res => { const f = $("#fp"); f.accept = accept; f.value = ""; f.onchange = () => res(f.files[0] || null); f.click(); });
async function mediaFrom(file) {
  const t = file.type || "";
  toast("Uploading...");
  const r = await uploadToCloudinary(file);
  if (t.startsWith("image/")) return { label: "\u{1F4F7} Photo", data: { imageUrl: r.url } };
  if (t.startsWith("video/")) return { label: "\u{1F3A5} Video", data: { videoUrl: r.url } };
  if (t.startsWith("audio/")) return { label: "\u{1F3A4} Voice message", data: { audioUrl: r.url } };
  return { label: "\u{1F4C4} " + file.name, data: { fileUrl: r.url, fileName: file.name, fileSize: file.size } };
}
function setPend(a) { PEND = a; const p = $("#pc"); if (p) p.innerHTML = a ? `${esc(a.label)} <a data-act="unpend">&#10005;</a>` : ""; }
async function deliver(att) { if (place === "g") await sendG(att); else { setPend(att); toast("Attached. Tap Post to send."); } }
async function sendFile(file, once) {
  try { const a = await mediaFrom(file); if (once && place === "g") a.data.viewOnce = true; await deliver(a); } catch (e) { console.error(e); toast(e.message || "Upload failed"); }
}
async function recStart() {
  if (rc || EDIT) return;
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return toast("Voice recording is not supported on this browser");
  let st; try { st = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { return toast("Allow microphone access to record"); }
  const mr = new MediaRecorder(st); rc = { mr, st, ch: [], t0: Date.now(), once: false, send: false, iv: 0 };
  mr.ondataavailable = e => e.data.size && rc.ch.push(e.data);
  mr.onstop = recDone; mr.start();
  $("#rt2").textContent = "0:00"; $("#ro").classList.remove("on");
  rc.iv = setInterval(() => { const s = (Date.now() - rc.t0) / 1000; $("#rt2").textContent = mmss(s); if (s >= 300) recEnd(true); }, 250);
  document.body.classList.add("recording");
}
function recEnd(send) { if (!rc || rc.mr.state !== "recording") return; rc.send = send; rc.mr.stop(); }
async function recDone() {
  const r = rc; rc = null; clearInterval(r.iv); r.st.getTracks().forEach(t => t.stop()); document.body.classList.remove("recording");
  if (!r.send) return;
  const secs = (Date.now() - r.t0) / 1000;
  if (secs < 1) return toast("Recording too short");
  const type = r.mr.mimeType || "audio/webm";
  try {
    const a = await mediaFrom(new File([new Blob(r.ch, { type })], "voice-note." + (type.includes("mp4") ? "m4a" : "webm"), { type }));
    a.data.duration = Math.round(secs); if (r.once && place === "g") a.data.viewOnce = true;
    await deliver(a);
  } catch (e) { console.error(e); toast(e.message || "Upload failed"); }
}
function syncRb() {
  const b = $("#rb"), i = $("#mi"); if (!b) return;
  const has = !!(i && i.value.trim()) || !!EDIT;

const isAdmin = o => !!o?.adminIds?.includes(me.uid);
const lis = (q, cb, arr) => (arr || unsub).push(onSnapshot(q, cb, e => { console.error(e); toast("Could not load. Check your connection or permissions."); }));
const clrSub = () => { sub.forEach(f => f()); sub = []; };
const clear = () => { unsub.forEach(f => f()); unsub = []; clrSub(); closeSheet(); closeViewer(); EDIT = null; if (rc && rc.mr.state === "recording") { rc.send = false; rc.mr.stop(); } if (AU) { AU.pause(); AU = null; AUid = null; } };

async function nameOf(uid) {
  if (names[uid]) return names[uid];
  try {
    const s = await getDoc(doc(db, "users", uid));
    const d = s.exists() ? s.data() : {};
    names[uid] = d.businessName || d.displayName || d.fullName || d.name || "Member"; photos[uid] = d.profileImageUrl || "";
  } catch (e) { names[uid] = "Member"; }
  return names[uid];
}

}
function sheet(html) { const s = $("#sh"); s.innerHTML = `<div class="card"><button class="ib shb" data-act="shx" aria-label="Back">${icon("back")}</button>${html}</div>`; s.classList.add("on"); }

/* ============================ LIST ============================ */
function row(k, o, subt, right = "") {

function paint() {
  const b = $("#rows"); if (!b) return;
  if (tab === "groups") {
    const a = [...cache.groups].sort((x, y) => (y.lastMessageAt?.seconds || 0) - (x.lastMessageAt?.seconds || 0));
    b.innerHTML = a.map(g => row("g", g, g.lastMessage || g.desc || `${g.memberIds.length} members`)).join("") ||
      `<div class="empty">You are not in any group yet.<br>Tap + to create one, or open an invite link.</div>`;
  } else if (tab === "channels") {
    const mine = cache.channels.filter(c => cache.follows.has(c.id));
    const rest = cache.channels.filter(c => !cache.follows.has(c.id));
    const r = (c, on) => row("c", c, `${c.followerCount || 0} followers`, `<button class="sm ${on ? "" : "gold"}" data-act="follow" data-id="${c.id}">${on ? "Following" : "Follow"}</button>`);
    b.innerHTML = (mine.length ? `<h5>Following</h5>${mine.map(c => r(c, true)).join("")}` : "") +
      (rest.length ? `<h5>Discover</h5>${rest.map(c => r(c, false)).join("")}` : "") ||
      `<div class="empty">No channels yet.<br>Tap + to start the first one.</div>`;
  } else {
    b.innerHTML = cache.communities.map(c => row("m", c, `${c.memberIds.length} members, ${c.groupCount || 0} groups`)).join("") ||
      `<div class="empty">You are not in any community yet.<br>A community bundles related groups under one announcement space.</div>`;
  }
}

  const map = s => s.docs.map(d => ({ id: d.id, ...d.data() }));

function createForm(ctx) {
  cx = ctx || tab;
  const L = { groups: "New group", channels: "New channel", communities: "New community", cgroup: "New group in this community" }[cx];

async function mk() {
  const n = $("#fn").value.trim(), d = $("#fd").value.trim();
  if (!n) return toast("Enter a name");
  const base = { name: n, desc: d, ownerId: me.uid, adminIds: [me.uid], createdAt: serverTimestamp() };
  try {
    if (cx === "channels") {
      const r = await addDoc(collection(db, "channels"), { ...base, followerCount: 1 });
      await setDoc(doc(db, "channelFollows", r.id + "_" + me.uid), { channelId: r.id, uid: me.uid, createdAt: serverTimestamp() });
      return route({ v: "c", id: r.id });
    }
    if (cx === "communities") {
      const r = await addDoc(collection(db, "communities"), { ...base, memberIds: [me.uid], groupCount: 0 });
      return route({ v: "m", id: r.id });
    }
    if (cx === "cgroup" && (C.groupCount || 0) >= LIM.commGroups) return toast("A community can hold 49 groups plus the announcement space");
    const r = await addDoc(collection(db, "groups"), {
      ...base, memberIds: [me.uid], onlyAdminsPost: false,
      communityId: cx === "cgroup" ? C.id : null, lastMessage: "", lastMessageAt: serverTimestamp()
    });
    if (cx === "cgroup") { await updateDoc(doc(db, "communities", C.id), { groupCount: increment(1) }); closeSheet(); }
    else route({ v: "g", id: r.id });
  } catch (e) { console.error(e); toast("Could not create. Try again."); }
}

/* ============================ ACTIONS ============================ */
const upd = (path, data) => updateDoc(doc(db, ...path), data);
const acts = {
  shclose: (_, t, e) => { if (e.target.id === "sh") closeSheet(); },
  back: () => goBack(), shx: () => closeSheet(),
  tab: (_, t) => { tab = t.dataset.v; list(); },
  new: () => sheet(createForm()),
  mk,
  open: (id, t) => route({ v: t.dataset.k, id }),
  send: () => sendG(), ginfo, addf: addFriends,
  me: openMe,
  share: (_, t) => shareSheet(t.dataset.v, t.dataset.t),
  nshare: (_, t) => navigator.share({ title: t.dataset.t, url: t.dataset.v }).catch(() => {}),
  attach: () => sheet(`<h3>Attach</h3><div class="sg"><a class="sb" data-act="pk" data-v="image/*"><span>&#128247;</span>Photo</a><a class="sb" data-act="pk" data-v="video/*"><span>&#127909;</span>Video</a><a class="sb" data-act="pk" data-v=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip"><span>&#128196;</span>Document</a></div>${place === "g" ? `<label class="lbl"><input type="checkbox" id="vo"> ${icon("once")} View once (photo or video)</label>` : ""}`),
  pk: async (_, t) => { const once = place === "g" && /^(image|video)\//.test(t.dataset.v) && !!$("#vo")?.checked; closeSheet(); const f = await pickFile(t.dataset.v); if (f) await sendFile(f, once); },
  voice: () => recStart(),
  rb: (_, t) => t.dataset.m === "s" ? sendG() : recStart(),
  rcancel: () => recEnd(false),
  rsend: () => recEnd(true),
  ronce: (_, t) => { if (!rc) return; rc.once = !rc.once; t.classList.toggle("on", rc.once); toast(rc.once ? (place === "g" ? "View once on" : "View once works in groups only") : "View once off"); },
  vplay: (id, t) => {
    if (AU && AUid === id) { AU.paused ? AU.play() : AU.pause(); return; }
    if (AU) { AU.pause(); const o = AUid; AU = null; AUid = null; vnUpd(o); }
    AU = new Audio(t.dataset.u); AUid = id; AUdur = +vnEl(id).querySelector(".vt").dataset.d || 0;
    AU.onloadedmetadata = () => { if (isFinite(AU.duration) && AU.duration > 0) AUdur = AU.duration; };
    AU.ontimeupdate = AU.onplay = AU.onpause = () => vnUpd(id);
    AU.onended = () => { AU.currentTime = 0; vnUpd(id); };
    AU.play().catch(() => toast("Could not play"));
  },
  zoom: (_, t) => showViewer(`<img src="${safe(t.dataset.u)}" alt="Photo">`),
  vclose: () => closeViewer(),
  vopen: async id => {
    const x = MSGS[id]; if (!x || x.senderId === me.uid || x.openedBy?.includes(me.uid)) return;
    try { await upd(["groups", G.id, "messages", id], { openedBy: arrayUnion(me.uid) }); } catch (e) { console.error(e); return toast("Could not open"); }
    showViewer(x.imageUrl ? `<img src="${safe(x.imageUrl)}" alt="">` : x.videoUrl ? `<video src="${safe(x.videoUrl)}" controls autoplay playsinline></video>` : `<audio src="${safe(x.audioUrl)}" controls autoplay></audio>`);
  },
  mm: id => {
    const x = MSGS[id]; if (!x) return;
    const mine = x.senderId === me.uid, hasMedia = ["imageUrl", "videoUrl", "audioUrl", "fileUrl"].some(k => x[k]);
    const age = Date.now() - (x.createdAt?.toMillis?.() ?? Date.now());
    const R = (a, i, l, c = "") => `<div class="mn ${c}" data-act="${a}" data-id="${id}">${icon(i)}<span>${l}</span></div>`;
    const body = (mine && !hasMedia && !x.viewOnce && age < 9e5 ? R("medit", "edit", "Edit") : "") + (x.viewOnce ? "" : R("mfwd", "fwd", "Forward")) + (x.text ? R("mcopy", "copy", "Copy") : "") + (mine || isAdmin(G) ? R("mdel", "trash", "Delete", "red") : "");
    if (body) sheet(`<h3>Message</h3>${body}`);
  },
  medit: id => {
    const x = MSGS[id]; if (!x) return; closeSheet(); EDIT = { id };
    $("#eb").innerHTML = `${icon("edit")}<span>Editing message</span><button data-act="eclose" aria-label="Cancel edit">${icon("x")}</button>`;
    const i = $("#mi"); i.value = x.text || ""; i.focus(); syncRb();
  },
  eclose: () => cancelEdit(),
  mcopy: id => { navigator.clipboard?.writeText(MSGS[id]?.text || "").then(() => toast("Copied")).catch(() => toast("Could not copy")); closeSheet(); },
  mdel: async id => { if (!confirm("Delete this message for everyone?")) return; closeSheet(); await deleteDoc(doc(db, "groups", G.id, "messages", id)); },
  mfwd: async id => {
    FW = MSGS[id]; if (!FW) return; closeSheet();
    const s = await getDocs(query(collection(db, "groups"), where("memberIds", "array-contains", me.uid)));
    const gs = s.docs.map(d => ({ id: d.id, ...d.data() }));
    sheet(`<h3>Forward to...</h3>` + (gs.map(g => `<div class="mrow"><span style="display:flex;align-items:center;gap:8px">${av(g, "s2")}${esc(g.name)}</span>${!g.onlyAdminsPost || isAdmin(g) ? `<button class="sm gold" data-act="mfsend" data-id="${g.id}">Send</button>` : `<em>Admins only</em>`}</div>`).join("") || `<div class="empty">You have no groups yet.</div>`));
  },
  mfsend: async (gid, t) => {
    const x = FW; if (!x) return;
    const d = { text: x.text || "" };
    ["imageUrl", "videoUrl", "audioUrl", "fileUrl", "fileName", "fileSize", "duration"].forEach(k => { if (x[k] !== undefined && x[k] !== "") d[k] = x[k]; });
    try {
      await addDoc(collection(db, "groups", gid, "messages"), { senderId: me.uid, senderName: myName, ...d, forwarded: true, createdAt: serverTimestamp() });
      await updateDoc(doc(db, "groups", gid), { lastMessage: `${myName}: ${d.text.slice(0, 80) || "Forwarded"}`, lastMessageAt: serverTimestamp() });
      t.outerHTML = "<em>Sent</em>";
    } catch (e) { console.error(e); toast("Could not forward"); }
  },
  unpend: () => setPend(null),
  setphoto: async (_, t) => {
    const k = t.dataset.k, f = await pickFile("image/*"); if (!f) return;
    if (!f.type.startsWith("image/")) return toast("Choose a photo");
    try {
      toast("Uploading...");
      const r = await uploadToCloudinary(f);
      const path = k === "u" ? ["users", me.uid] : k === "g" ? ["groups", G.id] : k === "c" ? ["channels", CH.id] : ["communities", C.id];
      await upd(path, k === "u" ? { profileImageUrl: r.url } : { photoURL: r.url });
      if (k === "u") { photos[me.uid] = r.url; closeSheet(); openMe(); } else closeSheet();
      toast("Photo updated");
    } catch (e) { console.error(e); toast(e.message || "Could not update photo"); }
  },
  rmphoto: async () => { await upd(["users", me.uid], { profileImageUrl: "" }); photos[me.uid] = ""; closeSheet(); openMe(); },
  copy: (_, t) => { const v = t.dataset.v; navigator.clipboard?.writeText(v).then(() => toast("Link copied")).catch(() => prompt("Copy this link", v)) ?? prompt("Copy this link", v); },
  oap: (_, t) => upd(["groups", G.id], { onlyAdminsPost: t.checked }),
  mkadm: async id => { await upd(["groups", G.id], { adminIds: G.adminIds.includes(id) ? arrayRemove(id) : arrayUnion(id) }); closeSheet(); toast("Updated"); },
  rm: async id => { await upd(["groups", G.id], { memberIds: arrayRemove(id), adminIds: arrayRemove(id) }); closeSheet(); toast("Member removed"); },
  addm: async (id, t) => {
    if (G.memberIds.length >= LIM.group) return toast("This group is full (1,024 members)");
    await upd(["groups", G.id], { memberIds: arrayUnion(id) }); t.outerHTML = "<em>Added</em>";
  },
  leave: async () => {
    if (!confirm("Leave this group?")) return;
    const rest = G.memberIds.filter(u => u !== me.uid), data = { memberIds: arrayRemove(me.uid), adminIds: arrayRemove(me.uid) };
    if (isAdmin(G) && G.adminIds.length === 1 && rest.length) data.adminIds = [rest[0]];
    await upd(["groups", G.id], data); goBack();
  },
  follow: async id => {
    const ref = doc(db, "channelFollows", id + "_" + me.uid), on = cache.follows.has(id);
    try {
      const b = writeBatch(db), ch = doc(db, "channels", id);
      if (on) { b.delete(ref); b.update(ch, { followerCount: increment(-1) }); }
      else { b.set(ref, { channelId: id, uid: me.uid, createdAt: serverTimestamp() }); b.update(ch, { followerCount: increment(1) }); }
      await b.commit();
    } catch (e) { console.error(e); toast("Could not update"); }
  },
  cpost: async () => {
    const t = $("#cpt").value.trim(); if (!t && !PEND) return;
    await addDoc(collection(db, "channels", CH.id, "updates"), { text: t, ...(PEND?.data || {}), authorId: me.uid, createdAt: serverTimestamp(), expireAt: Timestamp.fromMillis(Date.now() + LIM.days * 864e5), reactions: {} });
    $("#cpt").value = ""; setPend(null);
  },
  react: (id, t) => {
    const u = UPS.find(x => x.id === id), e = t.dataset.e;
    return upd(["channels", CH.id, "updates", id], { ["reactions." + me.uid]: u.reactions?.[me.uid] === e ? deleteField() : e });
  },
  uedit: async id => { const u = UPS.find(x => x.id === id), t = prompt("Edit update", u.text); if (t?.trim()) await upd(["channels", CH.id, "updates", id], { text: t.trim(), editedAt: serverTimestamp() }); },
  udel: async id => { if (confirm("Delete this update?")) await deleteDoc(doc(db, "channels", CH.id, "updates", id)); },
  ct: (_, t) => { ctab = t.dataset.v; clrSub(); mhead(); },
  cjoin: async () => {
    if (C.memberIds.length >= LIM.community) return toast("This community is full (5,000 members)");
    await upd(["communities", C.id], { memberIds: arrayUnion(me.uid) });
  },
  cinfo,
  cleave: async () => { if (confirm("Leave this community?")) { await upd(["communities", C.id], { memberIds: arrayRemove(me.uid), adminIds: arrayRemove(me.uid) }); goBack(); } },
  apost: async () => {
    const t = $("#at").value.trim(); if (!t && !PEND) return;
    await addDoc(collection(db, "communities", C.id, "announcements"), { text: t, ...(PEND?.data || {}), authorId: me.uid, createdAt: serverTimestamp() });
    $("#at").value = ""; setPend(null);
  },
  newcg: () => sheet(createForm("cgroup")),
  gjoin: async id => {
    const g = cg.find(x => x.id === id);
    if (g.memberIds.length >= LIM.group) return toast("This group is full");
    await upd(["groups", id], { memberIds: arrayUnion(me.uid) });
  }
};

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  try { await acts[t.dataset.act]?.(t.dataset.id, t, e); }
  catch (err) { console.error(err); toast("Something went wrong. Check your permissions and try again."); }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "mi" && e.key === "Enter") { e.preventDefault(); sendG(); }
  else if (e.key === "Escape") { if ($("#vw").classList.contains("on")) closeViewer(); else if ($("#sh").classList.contains("on")) closeSheet(); else if (EDIT) cancelEdit(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "mi") syncRb();
  else if (t.classList?.contains("vp") && AU && AUid === t.dataset.id && AUdur) AU.currentTime = (t.value / 100) * AUdur;
});
let lp = 0;
document.addEventListener("pointerdown", e => {
  const b = e.target.closest(".b[data-mid]"); if (!b || e.target.closest("a,button,video,audio,input")) return;
  lp = setTimeout(() => acts.mm(b.dataset.mid), 500);
});
["pointerup", "pointermove", "pointercancel", "scroll"].forEach(ev => document.addEventListener(ev, () => clearTimeout(lp), true));
document.addEventListener("contextmenu", e => { const b = e.target.closest(".b[data-mid]"); if (b) { e.preventDefault(); acts.mm(b.dataset.mid); } });

/* ============================ ROUTING (back button) ============================ */
function route(s, push = true) {
  if (push) history.pushState(s, "");
  if (s.v === "g") openGroup(s.id); else if (s.v === "c") openChannel(s.id); else if (s.v === "m") openComm(s.id); else list();
}
function goBack() { const v = history.state?.v; if (v && v !== "l") history.back(); else list(); }
window.addEventListener("popstate", e => { closeSheet(); closeViewer(); const s = e.state; route(s && s.v ? s : { v: "l" }, false); });
$("#back").innerHTML = icon("back");
$("#recbar").innerHTML = `<button class="ic" data-act="rcancel" aria-label="Cancel recording">${icon("trash")}</button><span class="rd"></span><span class="rt2" id="rt2">0:00</span><span class="sp"></span><button class="ic" id="ro" data-act="ronce" aria-label="View once">${icon("once")}</button><button class="ic snd" data-act="rsend" aria-label="Send voice note">${icon("send")}</button>`;

/* ============================ START ============================ */
async function joinGroup(id) {
  // Link din gayyata yana dauke da ID na group. Idan mutum ya riga ya zama member, ko group ya cika, update din ya gaza ba tare da lahani ba.
  try { await updateDoc(doc(db, "groups", id), { memberIds: arrayUnion(me.uid) }); }
  catch (e) { console.warn("join:", e.code); }
  history.replaceState({ v: "l" }, "", location.pathname);
  route({ v: "g", id });
}

onAuthStateChanged(auth, async user => {
  if (!user) { location.href = "login.html"; return; }
  me = user; myName = await nameOf(user.uid);
  const P = new URLSearchParams(location.search);
  try {
    if (P.get("join")) await joinGroup(P.get("join"));
    else if (P.get("channel")) { tab = "channels"; history.replaceState({ v: "l" }, "", location.pathname); route({ v: "c", id: P.get("channel") }); }
    else if (P.get("community")) { tab = "communities"; history.replaceState({ v: "l" }, "", location.pathname); route({ v: "m", id: P.get("community") }); }
    else { history.replaceState({ v: "l" }, ""); list(); }
  } catch (e) { console.error(e); list(); }
});
</script>

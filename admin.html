    input,

    .dashboard-header {

    .card {

    @media (max-width: 600px) {

      body {
        padding: 12px;

      .login-box {

      }

      .dashboard-header {
        border-radius: 15px;

      .cards {
        grid-template-columns: repeat(2, 1fr);

      }

      .card {
        padding: 17px;

      .card strong {
        font-size: 25px;
      }

      .category-item {

      .category-actions,

      .category-actions button,

      }

        height: 70px;

  </div>  <!-- FIREBASE -->  <script type="module">

    import {
      initializeApp
    } from

    import {
      getAuth,

    } from

    import {

      addDoc,
      updateDoc,

      serverTimestamp
    } from

    // ==============================
    // FIREBASE CONFIG
    // ==============================

    const firebaseConfig = {

      apiKey:
  "AIzaSyD48Bay25k24a5WckgM6AmuK3p68oGT6vk",
      authDomain:
        "arewa-market-4e603.firebaseapp.com",

      projectId:
        "arewa-market-4e603",

      storageBucket:
        "arewa-market-4e603.firebasestorage.app",

      messagingSenderId:
        "217844252739",

      appId:
        "1:217844252739:web:81b00d9ac29277c42d94f6",

      measurementId:
        "G-ZTQHETHX4T"
    };


    // ==============================
    // INITIALIZE
    // ==============================

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    // ==============================
    // ELEMENTS
    // ==============================

    const loginBox =

    const dashboard =

    const loginForm =

    const logoutBtn =

    // ==============================

    const categoryList =
      document.getElementById("categoryList");

    const categoriesCount =
      document.getElementById("categoriesCount");

    const categoryFormBox =
      document.getElementById("categoryFormBox");

    const categoryName =
      document.getElementById("categoryName");

    const addCategoryBtn =
      document.getElementById("addCategoryBtn");

    const saveCategoryBtn =
      document.getElementById("saveCategoryBtn");

    const cancelCategoryBtn =
      document.getElementById("cancelCategoryBtn");


    // ==============================

    const usersList =
      document.getElementById("usersList");

    const usersSearch =
      document.getElementById("usersSearch");

    const refreshUsersBtn =
      document.getElementById("refreshUsersBtn");
// ==============================
// SELLER APPLICATION ELEMENTS
// ==============================

const sellerApplicationsList =
  document.getElementById(
    "sellerApplicationsList"
  );

const refreshSellerApplicationsBtn =
  document.getElementById(
    "refreshSellerApplicationsBtn"
  );

    // ==============================
    // PRODUCT ELEMENTS
    // ==============================

    const productFormBox =
      document.getElementById("productFormBox");

    const addProductBtn =
      document.getElementById("addProductBtn");

    const cancelProductBtn =
      document.getElementById("cancelProductBtn");

    const saveProductBtn =
      document.getElementById("saveProductBtn");

    const productList =
      document.getElementById("productList");

    const productsSearch =
      document.getElementById("productsSearch");

    const productImageUrl =
      document.getElementById("productImageUrl");

    const imagePreviewBox =
      document.getElementById("imagePreviewBox");

    const imagePreview =
      document.getElementById("imagePreview");


    // ==============================
    // VARIABLES
    // ==============================

    let editingCategoryId = null;

  let allUsers = [];

let allProducts = [];

let allSellerApplications = [];


    // ==============================
    // MESSAGE
    // ==============================

    function showMessage(
      text,
      type = "error"
    ) {

      message.textContent = text;

      message.className = type;

      message.style.display = "block";
    }


    // ==============================
    // LOGIN
    // ==============================

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        loginBtn.disabled = true;

        loginBtn.textContent = "Checking...";

        message.style.display = "none";


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

        } catch (error) {

          console.error(error);

          showMessage(
            "Login failed: " +
            error.code +
            " — " +
            error.message
          );

          loginBtn.disabled = false;

          loginBtn.textContent = "Login";
        }

      }
    );


    // ==============================
    // AUTH STATE
    // ==============================

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          loginBox.style.display = "block";

          dashboard.style.display = "none";

          loginBtn.disabled = false;

          loginBtn.textContent = "Login";

          return;
        }


        try {

          const adminRef =
            doc(
              db,
              "admins",
              user.uid
            );

          const adminSnap =
            await getDoc(adminRef);


          if (!adminSnap.exists()) {

            await signOut(auth);

            showMessage(
              "Access denied. This account is not a Super Admin."
            );

            return;
          }


          const adminData =
            adminSnap.data();


          if (
            adminData.role !== "superAdmin" ||
            adminData.active !== true
          ) {

            await signOut(auth);

            showMessage(
              "Access denied. Super Admin permission required."
            );

            return;
          }


          loginBox.style.display = "none";

          dashboard.style.display = "block";

          adminEmail.textContent =
            "Logged in as: " +
            user.email;


        await loadCategories();

await loadUsers();

await loadSellerApplications();

await loadProducts();


        } catch (error) {

          console.error(error);

          await signOut(auth);

          showMessage(
            "Unable to verify Super Admin access: " +
            error.code +
            " — " +
            error.message
          );
        }

      }
    );


    // ==============================
    // ESCAPE HTML
    // ==============================

    function escapeHtml(value) {

      return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
    }


    // ==============================
    // CATEGORIES
    // ==============================

    async function loadCategories() {

      categoryList.innerHTML = `
        <div class="loading">
          Loading categories...
        </div>
      `;


      try {

        const snapshot =
          await getDocs(
            collection(db, "categories")
          );


        categoriesCount.textContent =
          snapshot.size;


        if (snapshot.empty) {

          categoryList.innerHTML = `
            <div class="empty">
              No categories yet.
            </div>
          `;

          return;
        }


        const categories = [];


        snapshot.forEach(
          (categoryDoc) => {

            categories.push({
              id: categoryDoc.id,
              ...categoryDoc.data()
            });

          }
        );


        categories.sort(
          (a, b) =>
            (a.name || "")
              .localeCompare(b.name || "")
        );


        categoryList.innerHTML = "";


        categories.forEach(
          (category) => {

            const item =
              document.createElement("div");

            item.className =
              "category-item";


            item.innerHTML = `

              <div class="category-info">

                <h3>
                  ${escapeHtml(
                    category.name ||
                    "Unnamed Category"
                  )}
                </h3>

                <p>
                  ID: ${escapeHtml(category.id)}
                </p>

              </div>

              <div class="category-actions">

                <button
                  class="edit-btn"
                  data-id="${escapeHtml(category.id)}"
                >
                  Edit
                </button>

                <button
                  class="delete-btn"
                  data-id="${escapeHtml(category.id)}"
                >

    function updateUserStats() {

      const totalUsers =
        allUsers.length;


      const totalSellers =
        allUsers.filter(
          user =>
            user.role === "seller" ||
            user.isSeller === true
        ).length;


      document.getElementById(
        "usersCount"
      ).textContent =
        totalUsers;


      document.getElementById(
        "sellersCount"
      ).textContent =
        totalSellers;
    }


    function renderUsers(users) {

      if (users.length === 0) {

        usersList.innerHTML = `
          <div class="loading">
            No users found.
          </div>
        `;

        return;
      }


      usersList.innerHTML =
        users.map(
          (user) => {

            const name =
              user.name || "No name";

            const email =
              user.email || "No email";

            const phone =
              user.phone || "No phone";

            const role =
              user.role || "buyer";

            const isSeller =
              role === "seller" ||
              user.isSeller === true;

            const active =
              user.active !== false;


            return `
              <div class="category-item">

                <div>

                  <strong>
                    ${escapeHtml(name)}
                  </strong>

                  <br>

                  <small>
                    Email:
                    ${escapeHtml(email)}
                  </small>

                  <br>

                  <small>
                    Phone:
                    ${escapeHtml(phone)}
                  </small>

                  <br>

                  <small>
                    Role:
                    ${escapeHtml(role)}
                  </small>

                  <br>

                  <small>
                    Status:
                    ${active ? "Active" : "Inactive"}
                  </small>

                </div>


                <div class="product-actions">

                  <button
                    onclick="toggleUserStatus(
                      '${escapeHtml(user.id)}',
                      ${active}
                    )"
                  >
                    ${active ? "Deactivate" : "Activate"}
                  </button>


                  <button
                    class="edit-btn"
                    onclick="toggleSeller(
                      '${escapeHtml(user.id)}',
                      ${isSeller}
                    )"
                  >
                    ${isSeller ? "Make Buyer" : "Make Seller"}
                  </button>


                  <button
                    class="delete-btn"
                    onclick="deleteUserProfile(
                      '${escapeHtml(user.id)}'
                    )"
                  >
                    Delete
                  </button>

                </div>

              </div>
            `;
          }
        ).join("");
    }

                align-items:flex-start;
                flex:1;
                min-width:0;
              "
            >

              ${imageHtml}


              <div class="product-info">

                <strong>
                  ${escapeHtml(
                    product.name ||
                    "Product"
                  )}
                </strong>

                <br>

                <small>
                  Price:
                  ₦${Number(
                    product.price || 0
                  ).toLocaleString()}
                </small>

                <br>

                <small>
                  Category:
                  ${escapeHtml(
                    product.category ||
                    "N/A"
                  )}
                </small>

                <br>

                <small>
                  Location:
                  ${escapeHtml(
                    product.location ||
                    "N/A"
                  )}
                </small>

                <br>

                <small>
                  Status:
                  ${escapeHtml(
                    product.status ||
                    "active"
                  )}
                </small>

              </div>

            </div>


            <div class="product-actions">

              <button
                class="edit-btn"
                onclick="
                  editProduct(
                    '${escapeHtml(product.id)}'
                  )
                "
              >
                Edit
              </button>


              <button
                class="delete-btn"
                onclick="
                  deleteProduct(
                    '${escapeHtml(product.id)}'
                  )
                "
              >
                Delete
              </button>

            </div>

          `;


          productList.appendChild(
            item
          );

        }
      );
    }


    // ==============================
    // PRODUCT SEARCH
    // ==============================

    productsSearch.addEventListener(
      "input",
      function() {

        const search =
          this.value
            .toLowerCase()
            .trim();


        const filtered =
          allProducts.filter(
            product => {

              const name =
                (product.name || "")
                  .toLowerCase();

              const category =
                (product.category || "")
                  .toLowerCase();

              const location =
                (product.location || "")
                  .toLowerCase();


              return (
                name.includes(search) ||
                category.includes(search) ||
                location.includes(search)
              );
            }
          );


        renderProducts(
          filtered
        );
      }
    );


    // ==============================
    // LOGOUT
    // ==============================

    logoutBtn.addEventListener(
      "click",
      async () => {

        try {

          await signOut(auth);

        } catch (error) {

          console.error(error);

        }
      }
    );

  </script></body>
</html>

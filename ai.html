<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arewa Market AI</title>
<meta name="theme-color" content="#0d3b2c">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Inter,Arial,sans-serif;color:#fff;
  background:radial-gradient(circle at 50% 28%,#1f7a4d 0%,#175e3f 38%,#0d3b2c 100%);
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));
  overflow:hidden;
}
.wrap{width:100%;max-width:380px}
.logo{width:150px;height:150px;margin:0 auto 22px;background:#fff;border-radius:50%;
  box-shadow:0 10px 40px rgba(0,0,0,.35),0 0 0 4px #c9a227;position:relative}
.logo svg{width:100%;height:100%;display:block}
.ring{transform-origin:50px 50px;animation:spin 14s linear infinite}
.petals{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(201,162,39,.55);
  animation:pulse 1.8s ease-out infinite}
.pulse.p2{animation-delay:.9s}
@keyframes pulse{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.25);opacity:0}}
h1{font-size:26px;letter-spacing:.3px;margin-bottom:6px}
.sub{font-size:14px;opacity:.85;margin-bottom:26px}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden;margin:0 auto 18px;max-width:280px}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#c9a227,#f3d36b);
  animation:load 2.6s ease-in-out forwards}
@keyframes load{0%{width:4%}60%{width:70%}100%{width:96%}}
.tip{min-height:48px;font-size:14px;line-height:1.5;opacity:.95;padding:0 6px;transition:opacity .3s}
.tip.fade{opacity:0}
.btn{display:inline-block;margin-top:20px;padding:12px 26px;border-radius:26px;background:#c9a227;color:#0d3b2c;
  font-weight:700;font-size:15px;text-decoration:none;border:0;cursor:pointer}
.back{display:block;margin-top:16px;color:#fff;opacity:.75;font-size:13px;text-decoration:underline}
.note{margin-top:22px;font-size:12px;opacity:.7;line-height:1.5}
@media(prefers-reduced-motion:reduce){.ring,.petals,.pulse,.bar i{animation:none}.bar i{width:70%}}
</style>
</head>
<body>
<div class="wrap">

  <div class="logo">
    <span class="pulse"></span><span class="pulse p2"></span>
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><path id="rp" d="M50,50 m-38,0 a38,38 0 1,1 76,0 a38,38 0 1,1 -76,0"/></defs>
      <g class="ring">
        <text font-family="Inter,Arial,sans-serif" font-size="9.4" font-weight="800" letter-spacing=".4" fill="#0d3b2c">
          <textPath href="#rp" textLength="236" lengthAdjust="spacing">AREWA MARKET AI<tspan fill="#c9a227"> • </tspan>AREWA MARKET AI<tspan fill="#c9a227"> • </tspan></textPath>
        </text>
      </g>
      <g transform="translate(50 50) scale(1.02) translate(-20 -20)"><g class="petals">
        <ellipse cx="20" cy="9" rx="4.6" ry="7.6" fill="#175e3f"/>
        <ellipse cx="20" cy="9" rx="4.6" ry="7.6" fill="#c9a227" transform="rotate(60 20 20)"/>
        <ellipse cx="20" cy="9" rx="4.6" ry="7.6" fill="#1f7a4d" transform="rotate(120 20 20)"/>
        <ellipse cx="20" cy="9" rx="4.6" ry="7.6" fill="#d9b84a" transform="rotate(180 20 20)"/>
        <ellipse cx="20" cy="9" rx="4.6" ry="7.6" fill="#0d3b2c" transform="rotate(240 20 20)"/>
        <ellipse cx="20" cy="9" rx="4.6" ry="7.6" fill="#2f8f5b" transform="rotate(300 20 20)"/>
      </g></g>
    </svg>
  </div>

  <h1>Arewa Market AI</h1>
  <p class="sub">Ana shirya maka mataimakin AI…</p>

  <div class="bar"><i></i></div>
  <p class="tip" id="tip">Tambayi game da kayayyaki, farashi da yadda ake kasuwanci.</p>

  <a class="btn" id="goNow" href="#">Buɗe yanzu</a>
  <a class="back" href="index.html">← Koma Arewa Market</a>

  <p class="note">Idan Google ya nemi ka shiga (sign in), ka shiga da asusun Google naka, sannan ka ci gaba.</p>
</div>

<script>
(function(){
  var GEM = "https://gemini.google.com/gem/11TOPANhCb5hhN0IuuWTyZSswV9tE80D8?usp=sharing";
  var tips = [
    "Tambayi game da kayayyaki, farashi da yadda ake kasuwanci.",
    "Ka nemi taimako wajen rubuta bayanin kayanka.",
    "Ka tambayi yadda za ka kare kanka daga 'yan damfara."
  ];
  var el = document.getElementById("tip"), i = 0;
  setInterval(function(){
    el.classList.add("fade");
    setTimeout(function(){ i = (i + 1) % tips.length; el.textContent = tips[i]; el.classList.remove("fade"); }, 300);
  }, 1300);

  function go(){ window.location.replace(GEM); }
  document.getElementById("goNow").addEventListener("click", function(e){ e.preventDefault(); go(); });
  setTimeout(go, 2600);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Arewa Market</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7f2;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:430px;
}

.logo{
  text-align:center;
  margin-bottom:20px;
}

.logo h1{
  color:#087443;
  font-size:30px;
}

.logo p{
  color:#666;
  margin-top:5px;
}

.card{
  background:white;
  padding:25px;
  border-radius:14px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.card h2{
  text-align:center;
  color:#087443;
  margin-bottom:20px;
}

.form-group{
  margin-bottom:16px;
}

label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin-bottom:6px;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#087443;
}

.password-box{
  position:relative;
}

.password-box input{
  padding-right:48px;
}

.toggle-password{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  cursor:pointer;
  font-size:19px;
  padding:3px;
  width:auto;
  color:#666;
}

.forgot{
  text-align:right;
  margin-top:-7px;
  margin-bottom:18px;
}

.forgot a{
  color:#087443;
  font-size:13px;
  font-weight:bold;
  text-decoration:none;
}

.login-btn{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#087443;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  padding:10px;
  border-radius:7px;
  margin-bottom:15px;
  font-size:13px;
}

.error{
  display:block;
  background:#ffe8e8;
  color:#b00020;
}

.success{
  display:block;
  background:#e5f7eb;
  color:#087443;
}

.register{
  text-align:center;
  margin-top:18px;
  color:#666;
  font-size:14px;
}

.register a{
  color:#087443;
  font-weight:bold;
  text-decoration:none;
}

</style>
</head>

<body>

<div class="container">

  <div class="logo">

    <h1>Arewa Market</h1>

    <p>Kasuwar Arewa a Hannunka</p>

  </div>


  <div class="card">

    <h2>Login</h2>


    <div
      id="message"
      class="message">
    </div>


    <form id="loginForm">


      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required>

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <div class="password-box">

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>

          <button
            type="button"
            class="toggle-password"
            id="togglePassword"
            aria-label="Show password">

            👁️

          </button>

        </div>

      </div>


      <div class="forgot">

        <a
          href="#"
          id="forgotPassword">

          Forgot Password?

        </a>

      </div>


      <button
        type="submit"
        class="login-btn"
        id="loginBtn">

        Login

      </button>

    </form>


    <div class="register">

      Don't have an account?

      <a href="register.html">
        Create Account
      </a>

    </div>

  </div>

</div>


<script type="module">

import {
  auth,
  db
} from "./firebase.js";


import {
  signInWithEmailAndPassword,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const form =
  document.getElementById(
    "loginForm"
  );


const button =
  document.getElementById(
    "loginBtn"
  );


const message =
  document.getElementById(
    "message"
  );


const password =
  document.getElementById(
    "password"
  );


const togglePassword =
  document.getElementById(
    "togglePassword"
  );


/* ==========================================
   SHOW / HIDE PASSWORD
========================================== */

togglePassword.addEventListener(
  "click",
  () => {

    if(
      password.type === "password"
    ){

      password.type =
        "text";

      togglePassword.textContent =
        "🙈";

      togglePassword.setAttribute(
        "aria-label",
        "Hide password"
      );

    }else{

      password.type =
        "password";

      togglePassword.textContent =
        "👁️";

      togglePassword.setAttribute(
        "aria-label",
        "Show password"
      );

    }

  }
);


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
  text,
  type
){

  message.textContent =
    text;

  message.className =
    "message " + type;

}


/* ==========================================
   LOGIN
========================================== */

form.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    const email =
      document.getElementById(
        "email"
      ).value.trim();


    const passwordValue =
      password.value;


    button.disabled =
      true;

    button.textContent =
      "Logging in...";


    try{

      /*
        FIREBASE AUTH LOGIN
      */

      const credential =
        await signInWithEmailAndPassword(
          auth,
          email,
          passwordValue
        );


      const user =
        credential.user;


      /*
        GET USER PROFILE
      */

      const userSnap =
        await getDoc(
          doc(
            db,
            "users",
            user.uid
          )
        );


      if(!userSnap.exists()){

        showMessage(
          "User profile was not found.",
          "error"
        );

        return;
      }


      const userData =
        userSnap.data();


      /*
        CHECK ACCOUNT STATUS
      */

      if(
        userData.active === false
      ){

        showMessage(
          "Your account is inactive. Please contact Arewa Market.",
          "error"
        );

        return;
      }


      showMessage(
        "Login successful. Please wait...",
        "success"
      );


      /*
        APPROVED SELLER
      */

      if(
        userData.role === "seller" &&
        userData.isSeller === true &&
        userData.sellerStatus === "approved"
      ){

        window.location.replace(
          "seller-dashboard.html"
        );

        return;
      }


      /*
        NORMAL BUYER
      */

      window.location.replace(
        "index.html"
      );


    }catch(error){

      console.error(
  "LOGIN ERROR CODE:",
  error.code
);

console.error(
  "LOGIN ERROR MESSAGE:",
  error.message
);

alert(
  "Firebase Error:\n" +
  error.code +
  "\n\n" +
  error.message
);


      let text =
        "Unable to login.";


      if(
        error.code ===
        "auth/invalid-credential"
      ){

        text =
          "Incorrect email or password.";

      }else if(
        error.code ===
        "auth/user-not-found"
      ){

        text =
          "No account was found with this email.";

      }else if(
        error.code ===
        "auth/wrong-password"
      ){

        text =
          "Incorrect password.";

      }else if(
        error.code ===
        "auth/invalid-email"
      ){

        text =
          "Please enter a valid email.";

      }else if(
        error.code ===
        "auth/too-many-requests"
      ){

        text =
          "Too many attempts. Please try again later.";

      }


      showMessage(
        text,
        "error"
      );


      button.disabled =
        false;

      button.textContent =
        "Login";

    }

  }
);


/* ==========================================
   FORGOT PASSWORD
========================================== */

document
  .getElementById(
    "forgotPassword"
  )
  .addEventListener(
    "click",
    async (event) => {

      event.preventDefault();


      const email =
        document.getElementById(
          "email"
        ).value.trim();


      if(!email){

        showMessage(
          "Enter your email address first, then click Forgot Password.",
          "error"
        );

        return;
      }


      try{

        await sendPasswordResetEmail(
          auth,
          email
        );


        showMessage(
          "Password reset email sent. Check your email inbox.",
          "success"
        );


      }catch(error){

        console.error(
          "PASSWORD RESET ERROR:",
          error
        );


        let text =
          "Unable to send password reset email.";


        if(
          error.code ===
          "auth/user-not-found"
        ){

          text =
            "No account was found with this email.";

        }else if(
          error.code ===
          "auth/invalid-email"
        ){

          text =
            "Please enter a valid email.";

        }


        showMessage(
          text,
          "error"
        );

      }

    }
  );

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arewa Market - Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">


<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}


h1,h2,h3,.brand h1,.brand-name,.logo,.hero h2,.page-title,.auth-title,.box h2,.modal h2,.modal-title{
  font-family:'Playfair Display',Georgia,serif;
  letter-spacing:.2px;
}
body{
  font-family:'Inter',Arial,sans-serif;
  background:
    linear-gradient(180deg,rgba(13,59,44,.96),rgba(10,46,34,.96)),
    repeating-linear-gradient(45deg,rgba(201,162,39,.07) 0 2px,transparent 2px 18px);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:420px;
  background:#fff;
  padding:30px 25px;
  border-radius:14px;
  box-shadow:0 15px 45px rgba(0,0,0,.35);
  border-top:4px solid #c9a227;
}

.logo{
  text-align:center;
  margin-bottom:25px;
}

.logo h1{
  color:#0d3b2c;
  font-size:28px;
  margin-bottom:6px;
}

.logo p{
  color:#777;
  font-size:14px;
}

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  margin-bottom:7px;
  font-weight:bold;
  color:#333;
  font-size:14px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #d5cfc3;
  border-radius:8px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#155a3a;
}

.password-box{
  position:relative;
}

.password-box input{
  padding-right:50px;
}

.eye{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  color:#555;
  font-size:18px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:8px;
  background:#155a3a;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#11482e;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.forgot{
  text-align:right;
  margin:8px 0 20px;
}

.forgot a{
  color:#155a3a;
  text-decoration:none;
  font-size:14px;
}

.register{
  text-align:center;
  margin-top:20px;
  color:#666;
  font-size:14px;
}

.register a{
  color:#155a3a;
  font-weight:bold;
  text-decoration:none;
}

.message{
  display:none;
  padding:12px;
  border-radius:8px;
  margin-bottom:18px;
  font-size:14px;
  line-height:1.5;
}

.message.error{
  display:block;
  background:#ffeaea;
  color:#a00000;
}

.message.success{
  display:block;
  background:#f5f1ea;
  color:#155a3a;
}
</style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10462d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arewa Market">
</head>

<body>

<div class="login-box">

  <div class="logo">
    <h1>Arewa Market</h1>
    <p>Kasuwar Arewa a Hannunka</p>
  </div>

  <div id="message" class="message"></div>

  <form id="loginForm">

    <div class="form-group">
      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
        autocomplete="email"
      >
    </div>

    <div class="form-group">

      <label for="password">Password</label>

      <div class="password-box">

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
          autocomplete="current-password"
        >

        <span class="eye" id="togglePassword">👁</span>

      </div>

    </div>

    <div class="forgot">
      <a href="#" id="forgotPassword">
        Forgot password?
      </a>
    </div>

    <button type="submit" id="loginBtn">
      Login
    </button>

  </form>

  <div class="register">
    Don't have an account?
    <a href="register.html">Create account</a>
  </div>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
  signInWithEmailAndPassword,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const loginForm =
  document.getElementById("loginForm");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const messageBox =
  document.getElementById("message");

const togglePassword =
  document.getElementById("togglePassword");

const forgotPassword =
  document.getElementById("forgotPassword");


function showMessage(text,type="error"){

  messageBox.textContent = text;

  messageBox.className =
    "message " + type;

}


function hideMessage(){

  messageBox.textContent = "";

  messageBox.className = "message";

}


/* =========================
   SHOW / HIDE PASSWORD
========================= */

togglePassword.addEventListener("click",()=>{

  if(passwordInput.type === "password"){

    passwordInput.type = "text";

    togglePassword.textContent = "🙈";

  }else{

    passwordInput.type = "password";

    togglePassword.textContent = "👁";

  }

});


/* =========================
   FORGOT PASSWORD
========================= */

forgotPassword.addEventListener("click",async(event)=>{

  event.preventDefault();

  hideMessage();

  const email =
    emailInput.value.trim();

  if(!email){

    showMessage(
      "Please enter your email first."
    );

    emailInput.focus();

    return;
  }

  try{

    await sendPasswordResetEmail(
      auth,
      email
    );

    showMessage(
      "Password reset email sent. Check your email inbox.",
      "success"
    );

  }catch(error){

    console.error(
      "PASSWORD RESET ERROR:",
      error.code,
      error.message
    );

    if(error.code === "auth/user-not-found"){

      showMessage(
        "No account was found with this email."
      );

    }else if(error.code === "auth/invalid-email"){

      showMessage(
        "Please enter a valid email address."
      );

    }else{

      showMessage(
        "Unable to send password reset email."
      );

    }

  }

});


/* =========================
   LOGIN
========================= */

loginForm.addEventListener("submit",async(event)=>{

  event.preventDefault();

  hideMessage();

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;

  if(!email || !password){

    showMessage(
      "Please enter your email and password."
    );

    return;
  }

  loginBtn.disabled = true;

  loginBtn.textContent =
    "Logging in...";


  try{

    /* =========================
       FIREBASE LOGIN
    ========================= */

    const credential =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    const user =
      credential.user;


    /* =========================
       GET USER PROFILE
    ========================= */

    const userSnap =
      await getDoc(
        doc(
          db,
          "users",
          user.uid
        )
      );


    if(!userSnap.exists()){

      await auth.signOut();

      showMessage(
        "Your account was created, but your user profile was not found."
      );

      return;
    }


    const userData =
      userSnap.data();


    /* =========================
       ACCOUNT STATUS
    ========================= */

    if(userData.active === false){

      await auth.signOut();

      showMessage(
        "Your account has been deactivated. Please contact Arewa Market."
      );

      return;
    }


    /* =================================================
       CHECK MESSAGE SELLER REDIRECT
    ================================================= */

    const redirectAfterLogin =
      sessionStorage.getItem(
        "arewaMarketRedirect"
      );


    if(
      redirectAfterLogin &&
      redirectAfterLogin.includes(
        "messages.html?sellerId="
      )
    ){

      sessionStorage.removeItem(
        "arewaMarketRedirect"
      );

      window.location.replace(
        redirectAfterLogin
      );

      return;
    }


    /* =================================================
       NORMAL LOGIN
       APPROVED SELLER → SELLER DASHBOARD
    ================================================= */

    const isApprovedSeller =
      userData.role === "seller" &&
      userData.isSeller === true &&
      userData.sellerStatus === "approved";


    if(isApprovedSeller){

      sessionStorage.removeItem(
        "arewaMarketRedirect"
      );

      window.location.replace(
        "seller-dashboard.html"
      );

      return;
    }


    /* =================================================
       NORMAL BUYER → INDEX
    ================================================= */

    sessionStorage.removeItem(
      "arewaMarketRedirect"
    );

    window.location.replace(
      "index.html"
    );


  }catch(error){

    console.error(
      "LOGIN ERROR CODE:",
      error.code
    );

    console.error(
      "LOGIN ERROR MESSAGE:",
      error.message
    );


    if(
      error.code === "auth/invalid-credential"
    ){

      showMessage(
        "Incorrect email or password."
      );

    }else if(
      error.code === "auth/wrong-password"
    ){

      showMessage(
        "Incorrect password."
      );

    }else if(
      error.code === "auth/user-not-found"
    ){

      showMessage(
        "No account was found with this email."
      );

    }else if(
      error.code === "auth/invalid-email"
    ){

      showMessage(
        "Please enter a valid email address."
      );

    }else if(
      error.code === "auth/too-many-requests"
    ){

      showMessage(
        "Too many login attempts. Please try again later."
      );

    }else if(
      error.code === "auth/network-request-failed"
    ){

      showMessage(
        "Network connection problem. Please check your internet connection and try again."
      );

    }else{

      showMessage(
        "Unable to login. Please try again."
      );

    }

  }finally{

    loginBtn.disabled = false;

    loginBtn.textContent =
      "Login";

  }

});

</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>

</html>

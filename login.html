<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Arewa Market - Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --green-900:#0d3b2c;
  --green-700:#155a3a;
  --green-600:#175e3f;
  --gold:#c9a227;
  --gold-dark:#a9791a;
  --cream:#f8f7f4;
  --line:#d5cfc3;
  --text:#222;
  --muted:#666;
}

html,body{min-height:100%}

body{
  font-family:'Inter',Arial,sans-serif;
  color:var(--text);
  background:
    linear-gradient(180deg,rgba(13,59,44,.96),rgba(10,46,34,.96)),
    repeating-linear-gradient(45deg,rgba(201,162,39,.07) 0 2px,transparent 2px 18px);
  background-attachment:fixed;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow-x:hidden;
}

/* ---------- Card ---------- */
.login-box{
  width:100%;
  max-width:420px;
  margin:0 auto;
  padding:30px 26px 26px;
  border-radius:16px;
  background:#fff;
  border-top:4px solid var(--gold);
  box-shadow:0 15px 45px rgba(0,0,0,.35);
}

.logo{text-align:center}

.logo-img{
  width:76px;height:76px;
  border-radius:20px;
  display:block;
  margin:0 auto 14px;
  box-shadow:0 0 0 3px #fff,0 0 0 5px var(--gold),0 8px 20px rgba(13,59,44,.3);
}

.brand{
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--gold-dark);
  margin-bottom:8px;
  font-weight:700;
}

.logo h1{
  font-family:'Playfair Display',Georgia,serif;
  font-weight:800;
  font-size:34px;
  line-height:1.1;
  color:var(--green-900);
  letter-spacing:.2px;
}
.logo h1 span{color:var(--green-700)}

.logo p{
  margin:10px 0 24px;
  color:var(--muted);
  font-size:14px;
}

/* ---------- Fields ---------- */
.form-group{margin-bottom:14px}

.field{position:relative}
.field .ico{
  position:absolute;
  left:16px;top:50%;
  transform:translateY(-50%);
  width:20px;height:20px;
  color:var(--green-700);
  pointer-events:none;
  display:flex;
}
.field .ico svg,.eye svg{width:100%;height:100%}

input{
  width:100%;
  height:52px;
  padding:0 16px 0 48px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  color:var(--text);
  font-family:inherit;
  font-size:15px;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
}
input::placeholder{color:#9a958a}
input:focus{
  border-color:var(--green-700);
  box-shadow:0 0 0 3px rgba(21,90,58,.15);
}
input:-webkit-autofill{
  -webkit-text-fill-color:var(--text);
  -webkit-box-shadow:0 0 0 100px #fff inset;
  caret-color:var(--text);
}

.password-box input{padding-right:50px}

.eye{
  position:absolute;
  right:16px;top:50%;
  transform:translateY(-50%);
  width:22px;height:22px;
  cursor:pointer;
  color:var(--green-700);
  display:flex;
}
.eye .off{display:none}
.eye.showing .on{display:none}
.eye.showing .off{display:block}

.forgot{text-align:right;margin:2px 0 18px}
.forgot a{color:var(--green-700);text-decoration:none;font-size:13px;font-weight:500}
.forgot a:hover{color:var(--gold-dark);text-decoration:underline}

/* ---------- Button ---------- */
button{
  width:100%;
  height:52px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,var(--green-600),var(--green-900));
  border-bottom:3px solid var(--gold);
  color:#fff;
  font-family:inherit;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 6px 16px rgba(13,59,44,.3);
  transition:transform .15s,box-shadow .2s,filter .2s;
}
button svg{width:20px;height:20px}
button:hover{filter:brightness(1.1);box-shadow:0 8px 20px rgba(13,59,44,.4)}
button:active{transform:scale(.98)}
button:disabled{opacity:.6;cursor:not-allowed}

.divider{
  display:flex;align-items:center;gap:12px;
  margin:24px 0 0;
  color:#8a857a;font-size:11px;letter-spacing:1.2px;
}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:#e6e0d3}

.register{
  text-align:center;
  margin-top:18px;
  color:var(--muted);
  font-size:14px;
}
.register a{color:var(--green-700);font-weight:700;text-decoration:none}
.register a:hover{color:var(--gold-dark);text-decoration:underline}

/* ---------- Messages ---------- */
.message{
  display:none;
  padding:12px 14px;
  border-radius:10px;
  margin-bottom:16px;
  font-size:13.5px;
  line-height:1.5;
}
.message.error{
  display:block;
  background:#ffeaea;
  border:1px solid #f2b8b8;
  color:#b3261e;
}
.message.success{
  display:block;
  background:#e8f5ee;
  border:1px solid #9fd1b4;
  color:var(--green-700);
}

/* ---------- Mobile ---------- */
@media (max-width:420px){
  .login-box{padding:26px 18px 22px}
  .logo h1{font-size:30px}
}
</style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10462d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arewa Market">
</head>

<body>

<div class="login-box">

  <div class="logo">
    <img class="logo-img" src="apple-touch-icon.png" alt="Arewa Market">
    <div class="brand">Kasuwar Arewa a Hannunka</div>
    <h1>Welcome <span>Back</span></h1>
    <p>Enter your details to access your account</p>
  </div>

  <div id="message" class="message"></div>

  <form id="loginForm">

    <div class="form-group">
      <div class="field">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>
        </span>
        <input
          type="email"
          id="email"
          placeholder="Email Address"
          required
          autocomplete="email"
          aria-label="Email address"
        >
      </div>
    </div>

    <div class="form-group">
      <div class="field password-box">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 018 0v2.5"/></svg>
        </span>
        <input
          type="password"
          id="password"
          placeholder="Password"
          required
          autocomplete="current-password"
          aria-label="Password"
        >
        <span class="eye" id="togglePassword" role="button" aria-label="Show or hide password">
          <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A9.7 9.7 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3.2 4.1M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1.1"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg>
        </span>
      </div>
    </div>

    <div class="forgot">
      <a href="#" id="forgotPassword">Forgot password?</a>
    </div>

    <button type="submit" id="loginBtn">Sign In</button>

  </form>

  <div class="divider">OR</div>

  <div class="register">
    Don’t have an account?
    <a href="register.html">Create account</a>
  </div>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
  signInWithEmailAndPassword,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const loginForm =
  document.getElementById("loginForm");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const messageBox =
  document.getElementById("message");

const togglePassword =
  document.getElementById("togglePassword");

const forgotPassword =
  document.getElementById("forgotPassword");


function showMessage(text,type="error"){

  messageBox.textContent = text;

  messageBox.className =
    "message " + type;

}


function hideMessage(){

  messageBox.textContent = "";

  messageBox.className = "message";

}


/* =========================
   SHOW / HIDE PASSWORD
========================= */

togglePassword.addEventListener("click",()=>{

  const hidden = passwordInput.type === "password";

  passwordInput.type = hidden ? "text" : "password";

  togglePassword.classList.toggle("showing", hidden);

});


/* =========================
   FORGOT PASSWORD
========================= */

forgotPassword.addEventListener("click",async(event)=>{

  event.preventDefault();

  hideMessage();

  const email =
    emailInput.value.trim();

  if(!email){

    showMessage(
      "Please enter your email first."
    );

    emailInput.focus();

    return;
  }

  try{

    await sendPasswordResetEmail(
      auth,
      email
    );

    showMessage(
      "Password reset email sent. Check your email inbox.",
      "success"
    );

  }catch(error){

    console.error(
      "PASSWORD RESET ERROR:",
      error.code,
      error.message
    );

    if(error.code === "auth/user-not-found"){

      showMessage(
        "No account was found with this email."
      );

    }else if(error.code === "auth/invalid-email"){

      showMessage(
        "Please enter a valid email address."
      );

    }else{

      showMessage(
        "Unable to send password reset email."
      );

    }

  }

});


/* =========================
   LOGIN
========================= */

loginForm.addEventListener("submit",async(event)=>{

  event.preventDefault();

  hideMessage();

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;

  if(!email || !password){

    showMessage(
      "Please enter your email and password."
    );

    return;
  }

  loginBtn.disabled = true;

  loginBtn.textContent =
    "Signing in...";


  try{

    /* =========================
       FIREBASE LOGIN
    ========================= */

    const credential =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    const user =
      credential.user;


    /* =========================
       GET USER PROFILE
    ========================= */

    const userSnap =
      await getDoc(
        doc(
          db,
          "users",
          user.uid
        )
      );


    if(!userSnap.exists()){

      await auth.signOut();

      showMessage(
        "Your account was created, but your user profile was not found."
      );

      return;
    }


    const userData =
      userSnap.data();


    /* =========================
       ACCOUNT STATUS
    ========================= */

    if(userData.active === false){

      await auth.signOut();

      showMessage(
        "Your account has been deactivated. Please contact Arewa Market."
      );

      return;
    }


    /* =================================================
       CHECK MESSAGE SELLER REDIRECT
    ================================================= */

    const redirectAfterLogin =
      sessionStorage.getItem(
        "arewaMarketRedirect"
      );


    if(
      redirectAfterLogin &&
      redirectAfterLogin.includes(
        "messages.html?sellerId="
      )
    ){

      sessionStorage.removeItem(
        "arewaMarketRedirect"
      );

      window.location.replace(
        redirectAfterLogin
      );

      return;
    }


    /* =================================================
       NORMAL LOGIN
       APPROVED SELLER → SELLER DASHBOARD
    ================================================= */

    const isApprovedSeller =
      userData.role === "seller" &&
      userData.isSeller === true &&
      userData.sellerStatus === "approved";


    if(isApprovedSeller){

      sessionStorage.removeItem(
        "arewaMarketRedirect"
      );

      window.location.replace(
        "seller-dashboard.html"
      );

      return;
    }


    /* =================================================
       NORMAL BUYER → INDEX
    ================================================= */

    sessionStorage.removeItem(
      "arewaMarketRedirect"
    );

    window.location.replace(
      "index.html"
    );


  }catch(error){

    console.error(
      "LOGIN ERROR CODE:",
      error.code
    );

    console.error(
      "LOGIN ERROR MESSAGE:",
      error.message
    );


    if(
      error.code === "auth/invalid-credential"
    ){

      showMessage(
        "Incorrect email or password."
      );

    }else if(
      error.code === "auth/wrong-password"
    ){

      showMessage(
        "Incorrect password."
      );

    }else if(
      error.code === "auth/user-not-found"
    ){

      showMessage(
        "No account was found with this email."
      );

    }else if(
      error.code === "auth/invalid-email"
    ){

      showMessage(
        "Please enter a valid email address."
      );

    }else if(
      error.code === "auth/too-many-requests"
    ){

      showMessage(
        "Too many login attempts. Please try again later."
      );

    }else if(
      error.code === "auth/network-request-failed"
    ){

      showMessage(
        "Network connection problem. Please check your internet connection and try again."
      );

    }else{

      showMessage(
        "Unable to login. Please try again."
      );

    }

  }finally{

    loginBtn.disabled = false;

    loginBtn.textContent =
      "Sign In";

  }

});

</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
